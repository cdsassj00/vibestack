<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브라우저의 재발견 2 · 모션·영상 능력 사전</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{--paper:#000000;--surf:#1c1c1e;--tint:#2c2c2e;--tint2:#3a3a3c;--hair:#38383a;--hair2:#48484a;
--ink:#f5f5f7;--body:#d1d1d6;--mut:#98989d;--faint:#6e6e73;--accent:#0a84ff;--accent-hi:#409cff;--gold:#ffd60a;
--fg-blue:#64b5ff;--fg-green:#4cd964;--fg-orange:#ffb340;--fg-purple:#da8fff;--fg-teal:#5ed5ea;--fg-pink:#ff6482;--fg-gold:#ffd60a;--fg-red:#ff6961;
--bg-blue:rgba(100,181,255,.14);--bg-green:rgba(76,217,100,.14);--bg-orange:rgba(255,179,64,.14);--bg-purple:rgba(218,143,255,.14);--bg-teal:rgba(94,213,234,.14);--bg-pink:rgba(255,100,130,.14);--bg-gold:rgba(255,214,10,.14);--bg-red:rgba(255,105,97,.14);
--header-bg:rgba(0,0,0,.6);--card-shadow:none;--emphasis-bg:linear-gradient(165deg,#0c1a33 0%,#000000 100%);--focus-ring:rgba(10,132,255,.28);
--stage:#0b0b0d;--hot:#ff453a;--cap:#ffd60a;--vid:#0a84ff;--aud:#30d158;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="light"]{--paper:#f5f5f7;--surf:#ffffff;--tint:#f2f2f7;--tint2:#e5e5ea;--hair:#d2d2d7;--hair2:#c7c7cc;
--ink:#1d1d1f;--body:#424245;--mut:#6e6e73;--faint:#86868b;--accent:#0071e3;--accent-hi:#0066cc;
--fg-blue:#0066cc;--fg-green:#1f7a35;--fg-orange:#b25000;--fg-purple:#8944ab;--fg-teal:#0e6f80;--fg-pink:#c4133f;--fg-gold:#8a6100;--fg-red:#d70015;
--bg-blue:rgba(0,113,227,.12);--bg-green:rgba(31,122,53,.12);--bg-orange:rgba(178,80,0,.12);--bg-purple:rgba(137,68,171,.12);--bg-teal:rgba(14,111,128,.12);--bg-pink:rgba(196,19,63,.12);--bg-gold:rgba(255,214,10,.22);--bg-red:rgba(215,0,21,.10);
--header-bg:rgba(245,245,247,.72);--card-shadow:0 1px 3px rgb(0 0 0/.06),0 4px 16px rgb(0 0 0/.04);--emphasis-bg:linear-gradient(165deg,#e8f1ff 0%,#ffffff 100%);--focus-ring:rgba(0,113,227,.22);--stage:#111114;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(110px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--body);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;letter-spacing:-.01em;font-feature-settings:"ss05";word-break:keep-all;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{color:var(--ink);font-weight:600;line-height:1.25;letter-spacing:-.028em;margin:0}
h1{font-weight:650}
a{color:var(--accent);text-decoration:none}
::selection{background:rgba(10,132,255,.35)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,D2Coding,"Pretendard Variable",monospace;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.over{font-size:13px;font-weight:600;color:var(--mut)}
.mut{color:var(--mut)}
.topband{position:sticky;top:0;z-index:22;display:block;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:linear-gradient(90deg,#b8860b 0%,#e9b949 18%,#ffe082 50%,#e9b949 82%,#b8860b 100%);color:#2a1d00;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.topband .in{position:relative;max-width:1120px;height:38px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.topband .in b{font-weight:800}
.topband .url{font-weight:700;background:rgba(42,29,0,.12);border-radius:999px;padding:2px 10px}
.topband .arr{transition:transform .2s}
.topband:hover .arr{transform:translateX(3px)}
.topband:hover{filter:brightness(1.04)}
.topband:before{content:'';position:absolute;top:0;bottom:0;left:-30%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-30%}100%{left:130%}}
.tb-short{display:none}
@media (max-width:640px){.tb-full{display:none}.tb-short{display:inline}.topband .in{font-size:13px;padding:0 12px}}
@media (prefers-reduced-motion:reduce){.topband:before{animation:none;display:none}}
.hdr{position:sticky;top:calc(38px + env(safe-area-inset-top,0px));z-index:20;height:56px;background:var(--header-bg);-webkit-backdrop-filter:saturate(150%) blur(20px);backdrop-filter:saturate(150%) blur(20px);border-bottom:1px solid var(--hair)}
.hdr .in{max-width:1120px;height:56px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.site-switch{display:flex;background:var(--tint);border-radius:999px;padding:3px}
.site-switch a{font:inherit;font-size:13.5px;font-weight:500;color:var(--mut);border-radius:999px;padding:5px 12px;cursor:pointer;transition:color .15s,background-color .15s}
.site-switch .on{background:var(--surf);color:var(--ink);box-shadow:var(--card-shadow)}
.site-switch a:hover{color:var(--ink)}
.ss-short{display:none}
.links{display:flex;gap:2px;margin-left:auto}
.links a{font-size:14px;color:var(--mut);padding:6px 10px;border-radius:999px;transition:color .15s,background-color .15s}
.links a:hover{color:var(--ink);background:var(--tint)}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:15px;font-weight:500;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;transition:background-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hi)}
.btn-secondary{background:var(--tint);color:var(--ink)}.btn-secondary:hover{background:var(--tint2)}
.btn-ghost{background:transparent;color:var(--mut)}.btn-ghost:hover{background:var(--tint);color:var(--ink)}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:999px;padding:4px 10px;background:var(--tint);color:var(--body);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.c-blue{background:var(--bg-blue);color:var(--fg-blue)}.c-green{background:var(--bg-green);color:var(--fg-green)}.c-orange{background:var(--bg-orange);color:var(--fg-orange)}
.c-purple{background:var(--bg-purple);color:var(--fg-purple)}.c-teal{background:var(--bg-teal);color:var(--fg-teal)}.c-pink{background:var(--bg-pink);color:var(--fg-pink)}
.c-gold{background:var(--bg-gold);color:var(--fg-gold)}.c-red{background:var(--bg-red);color:var(--fg-red)}
.d-blue{background:var(--fg-blue)}.d-green{background:var(--fg-green)}.d-orange{background:var(--fg-orange)}.d-purple{background:var(--fg-purple)}.d-teal{background:var(--fg-teal)}.d-pink{background:var(--fg-pink)}.d-gold{background:var(--fg-gold)}.d-red{background:var(--fg-red)}
.t-blue{color:var(--fg-blue)}.t-green{color:var(--fg-green)}.t-orange{color:var(--fg-orange)}.t-purple{color:var(--fg-purple)}.t-teal{color:var(--fg-teal)}.t-pink{color:var(--fg-pink)}.t-gold{color:var(--fg-gold)}.t-red{color:var(--fg-red)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.surf{background:var(--surf);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--card-shadow)}
@media (max-width:900px){.links{display:none}.site-switch{margin-left:auto}}
@media (max-width:640px){.wrap,.hdr .in{padding:0 16px}.brand span{display:none}.ss-full{display:none}.ss-short{display:inline}}
/* list view */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start;padding:72px 0 64px}
.intro>*{min-width:0}
.intro h1{font-size:clamp(34px,5.4vw,52px);margin:10px 0 16px}
.intro .desc{font-size:16px;line-height:1.65;color:var(--mut);margin:0 0 16px;max-width:34em}
.motto{color:var(--ink);font-weight:500;margin:0 0 24px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.search{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid transparent;border-radius:14px;padding:0 14px;max-width:520px;color:var(--mut);transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;padding:13px 0;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.cloud{padding:22px 24px;border-radius:22px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;line-height:1.2}
.cloud a{font-weight:600;transition:color .15s,opacity .15s;overflow-wrap:anywhere;word-break:normal}
.cloud a:hover{color:var(--ink)}
.cloud a.dim{opacity:.18}
.cloud .cap{flex-basis:100%;margin-bottom:8px}
.filters{display:flex;flex-direction:column;gap:12px;padding:0 0 24px;border-bottom:1px solid var(--hair)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .over{width:56px;flex:none}
.fb{font:inherit;font-size:13.5px;font-weight:500;border:1px solid transparent;background:var(--tint);color:var(--body);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,color .15s,border-color .15s}
.fb:hover{background:var(--tint2)}
.fb b{font-weight:500;color:var(--faint)}
.fb[aria-pressed="true"]{background:var(--bg-blue);color:var(--fg-blue);border-color:var(--fg-blue)}
.fb[aria-pressed="true"] b{color:inherit}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:28px 0 16px}
.listhead h2{font-size:clamp(24px,3.4vw,30px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:96px}
.card{display:flex;flex-direction:column;gap:8px;padding:20px;color:inherit;transition:border-color .15s,background-color .15s}
.card:hover{border-color:var(--hair2);background:var(--tint)}
[data-theme="light"] .card:hover{background:var(--surf);border-color:var(--hair2)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .key{font-size:17px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;word-break:normal}
.card h3{font-size:16.5px;color:var(--body);font-weight:600;letter-spacing:-.02em}
.card p{margin:0;font-size:14.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.empty{padding:40px 0 96px;color:var(--mut)}
.foot{border-top:1px solid var(--hair);padding:28px 0 48px;color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.foot a{color:var(--mut);text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.intro{grid-template-columns:minmax(0,1fr);gap:28px;padding:56px 0 48px}}
@media (max-width:640px){.intro{padding:40px 0 40px}.grid{padding-bottom:64px}}
/* detail view */
.crumb{padding:28px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{color:var(--mut);font-size:13px;font-weight:600}.crumb a:hover{color:var(--ink)}
.dtop{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding:20px 0 56px;border-bottom:1px solid var(--hair)}
.dtop>*{min-width:0}
.keybig{font-size:clamp(26px,4.4vw,40px);font-weight:600;color:var(--ink);margin:0 0 14px;overflow-wrap:anywhere;word-break:normal}
.dtop h1{font-size:clamp(28px,4.6vw,38px);line-height:1.18;margin:0 0 18px}
.prob{background:var(--emphasis-bg);border:1px solid var(--hair);border-radius:18px;padding:16px 18px;margin:0 0 14px}
.prob p{margin:4px 0 0;color:var(--ink);font-size:16.5px}
.sum{color:var(--mut);font-size:16px;line-height:1.65;margin:0 0 22px;max-width:38em}
.cta{display:flex;flex-wrap:wrap;gap:8px}
.factbox{padding:18px;align-self:start}
.factbox dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:14.5px}
.factbox dt{color:var(--mut)}.factbox dd{margin:0;color:var(--ink);font-weight:500}
section.s{padding:56px 0 0}
section.s>h2{font-size:clamp(22px,3.2vw,28px);margin:0 0 6px}
section.s>.sd{color:var(--mut);margin:0 0 18px;font-size:15px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ladder span{font-size:13px;text-align:center;padding:10px 6px;border-radius:999px;background:var(--tint);color:var(--faint);font-weight:500;line-height:1.3}
.ladder span.past{background:var(--tint2);color:var(--body)}
.ladder span.on{background:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{padding:18px 20px}
.box h3{font-size:17px;margin:0 0 12px}
.box .chips{display:flex;flex-wrap:wrap;gap:6px}
.box p{margin:0;color:var(--mut);font-size:15px}
.warn{background:var(--bg-red);border-radius:14px;padding:18px 20px}
.warn h3{font-size:17px;margin:0 0 10px;color:var(--fg-red)}
.warn p{margin:0;color:var(--ink)}
.prompt{padding:20px 22px}
.prompt p{margin:0 0 14px;color:var(--ink);font-size:16.5px;line-height:1.7;white-space:pre-wrap}
.pn{display:flex;justify-content:space-between;gap:12px;margin:72px 0 0;padding:24px 0 72px;border-top:1px solid var(--hair)}
.pn a{max-width:48%;color:inherit}.pn a:hover b{color:var(--accent)}.pn b{display:block;color:var(--ink);font-weight:600;margin-top:2px;transition:color .15s}
.pn a:last-child{text-align:right;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;pointer-events:none;z-index:30}
.nodemo{border:1px dashed var(--hair2);border-radius:18px;padding:18px 20px;color:var(--mut)}
@media (max-width:900px){.dtop{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:640px){.ladder{grid-template-columns:1fr 1fr}.ladder span{font-size:12px}section.s{padding-top:40px}}
/* demo stage */
.stage{background:var(--stage);color:#e9ecf2;border:1px solid var(--hair);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage button.b{height:38px;padding:0 16px;border-radius:999px;border:0;background:#0a84ff;color:#fff;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer}
.stage button.b:hover{background:#409cff}
.stage button.b.alt{background:#2c2c2e;color:#f5f5f7}
.stage button.b.alt:hover{background:#3a3a3c}
.stage input[type=text],.stage textarea,.stage select{background:#1c1c1e;color:#f5f5f7;border:1px solid #38383a;border-radius:12px;padding:9px 12px;font:inherit;font-size:15px}
.stage textarea{width:100%;min-height:96px;resize:vertical}
.stage input[type=range]{flex:1;min-width:160px;accent-color:#0a84ff}
.stage label{font-size:14px;color:#98989d;display:flex;gap:8px;align-items:center}
.stage canvas,.stage svg,.stage video{display:block;width:100%;height:auto;border-radius:12px;background:#000}
.stage .note{font-size:13.5px;color:#98989d;margin:0}
.stage .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#000;border-radius:12px;padding:12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.rowfx{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:36px;background:#1c1c1e;border-radius:999px}
.track i{position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#0a84ff}
.kara{font-size:22px;line-height:1.7;font-weight:600}
.kara span{transition:color .1s,background .1s;border-radius:4px;padding:0 1px}
.kara span.on{background:#ffd60a;color:#111}
.kin{min-height:150px;display:flex;flex-wrap:wrap;gap:.3em;align-content:center;justify-content:center;font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.2;text-align:center;letter-spacing:-.04em}
.kin span{display:inline-block;opacity:0;position:relative}
.kin span b{font-weight:800;position:relative;z-index:1}
.kin span.hl:before{content:'';position:absolute;inset:.08em -.08em 0;background:#ff453a;transform-origin:left;transform:scaleX(var(--hx,0));z-index:0}
.scr{font-weight:800;font-size:clamp(28px,5vw,46px);min-height:1.4em;text-align:center;letter-spacing:-.03em}
.clip{font-weight:900;font-size:clamp(90px,18vw,170px);line-height:1;text-align:center;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:220% 220%;padding:10px 0;letter-spacing:-.06em}
.vf{font-family:"Noto Sans KR",sans-serif;font-size:clamp(70px,14vw,130px);text-align:center;line-height:1.1}
.vtbox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:220px}
.vtbox div{border-radius:14px;background:#2c2c2e;display:grid;place-items:center;font-weight:600}
.vtbox .hero2{background:#0a84ff;view-transition-name:vthero}
.vtbox.big{grid-template-columns:1fr}
.vtbox.big div:not(.hero2){display:none}
.vtbox.big .hero2{min-height:220px;font-size:28px}
.frz{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#0c1a33,#2a1440)}
.frz .m{position:absolute;width:70px;height:70px;border-radius:50%;background:#fff;opacity:.85;animation:float 2.2s ease-in-out infinite alternate}
.frz .m:nth-child(2){left:60%;top:20%;width:110px;height:110px;background:#ffd60a;animation-duration:1.7s}
.frz .m:nth-child(3){left:25%;top:55%;background:#30d158;animation-duration:2.6s}
.frz .cap{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-weight:700;font-size:clamp(16px,2.6vw,22px);text-shadow:0 2px 12px #000}
.frz.stop .m{animation-play-state:paused}
.frz.stop{filter:grayscale(.9) contrast(1.15) brightness(.8)}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}
.stamp{position:absolute;left:50%;top:44%;padding:10px 26px 14px;border:7px solid #E8321E;border-radius:14px;color:#E8321E;background:rgba(255,248,240,.92);font-weight:900;font-size:clamp(30px,6vw,56px);white-space:nowrap;opacity:0;transform:translate(-50%,-50%) rotate(-6deg);letter-spacing:-.04em}
.stamp small{display:block;font-weight:800;font-size:14px;letter-spacing:.3em;text-align:center}
.srtt{width:100%;border-collapse:collapse;font-size:13.5px}
.srtt td,.srtt th{border-bottom:1px solid #2c2c2e;padding:6px 8px;text-align:left}
.srtt .warn{color:#ffd60a;background:none;padding:6px 8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
/* Netlify "Powered by Netlify" 플로팅 배지 숨김 (공식 끄기: Project configuration > General > Powered by Netlify badge) */
#nl-badge-frame{display:none!important;visibility:hidden!important;pointer-events:none!important}
</style>

<script>
const D=[
['MV-001','T','render(t)','시간으로 그리는 화면','화면을 "지금 몇 초인가" 하나로만 그립니다. 같은 시간에는 늘 같은 그림이 나오니, 한 장씩 찍어 이어 붙이면 그대로 영상이 됩니다.',0,'scrub','전체','Math.random()이나 Date.now()를 쓰면 찍을 때마다 그림이 달라집니다. 무작위가 필요하면 시간과 번호로 계산한 값을 씁니다.','0초부터 10초까지 슬라이더를 움직이면 장면이 그 시간의 상태로 그려지게 해줘. render(t) 함수 하나에 모든 그리기를 모으고, 재생 버튼은 슬라이더를 자동으로 움직이기만 하게.'],
['MV-002','T','@keyframes','CSS 애니메이션','처음과 끝 모양만 적으면 브라우저가 중간을 채웁니다. 반복, 지연, 방향을 한 줄로 정합니다.',0,'','1, 15','영상으로 찍을 때는 재생 중인 애니메이션을 정확한 시간에 세우기 어렵습니다. animation-delay를 음수로 주고 멈춰서 시간을 맞춥니다.','@keyframes로 제목이 아래에서 올라오고 밑줄이 그어지는 오프닝을 만들어줘. 각 요소의 지연 시간을 CSS 변수로 조절할 수 있게.'],
['MV-003','T','Element.animate()','웹 애니메이션 API','자바스크립트로 애니메이션을 만들고, 멈추고, currentTime으로 원하는 순간으로 바로 이동합니다.',0,'','1, 14','여러 애니메이션을 함께 움직일 때는 각각의 currentTime을 같은 값으로 맞춰야 어긋나지 않습니다.','버튼을 누르면 카드 세 장이 시간차로 날아 들어오고, 슬라이더로 전체 애니메이션의 currentTime을 조절할 수 있게 웹 애니메이션 API로 만들어줘.'],
['MV-004','T','cubic-bezier','이징, 움직임의 성격','같은 거리를 가도 속도 곡선이 성격을 정합니다. 쾅 내려꽂기, 미끄러지듯 감속, 통 튀기를 비교해 보세요.',0,'easing','1, 2, 9','모든 움직임에 같은 이징을 쓰면 밋밋합니다. 등장은 감속, 충돌은 가속, 강조는 튕김처럼 역할을 나눕니다.','네 가지 이징(linear, 가속, 감속 expo, 튕김 back)으로 같은 공을 동시에 움직여 비교하는 페이지를 만들어줘. 각 곡선의 cubic-bezier 값도 화면에 보여줘.'],
['MV-005','T','requestAnimationFrame','실시간 그리기 루프','화면이 새로 그려질 때마다 함수를 불러 매 프레임 그림을 갱신합니다. 체험형 애니메이션의 심장입니다.',0,'','전체','탭이 숨으면 멈추고 기기마다 프레임 수가 다릅니다. 움직임은 프레임 수가 아니라 흐른 시간으로 계산합니다.','requestAnimationFrame으로 공 100개가 튕기는 캔버스를 만들되, 위치는 흐른 시간(초)으로 계산해서 기기 성능과 상관없이 같은 속도로 움직이게 해줘.'],
['MV-006','T','startViewTransition','화면 전환 애니메이션','화면 A를 B로 바꿀 때 같은 이름의 요소가 자리를 옮기며 자연스럽게 이어집니다. 컷이 아니라 변신입니다.',0,'vt','62, 36','최신 크롬·엣지·사파리에서 동작합니다. 지원하지 않으면 그냥 바뀌도록 대비 코드를 둡니다.','카드 목록에서 하나를 누르면 그 카드가 화면 가득 커지는 전환을 document.startViewTransition과 view-transition-name으로 만들어줘. 지원하지 않는 브라우저에서는 그냥 바뀌게.'],
['MV-007','T','animation-timeline','스크롤로 움직이는 애니메이션','스크롤 위치가 곧 시간이 됩니다. 스크롤을 내리면 장면이 진행되는 스크롤리텔링 페이지를 자바스크립트 없이 만듭니다.',0,'','13, 62','지원 브라우저가 아직 넓지 않습니다. 영상으로 만들 때는 같은 장면을 render(t)로 다시 그립니다.','animation-timeline: scroll()로 스크롤하면 연도가 바뀌고 막대가 자라는 연혁 페이지를 만들어줘.'],
['MV-008','T','BPM 그리드','박자에 맞춘 편집','장면 길이를 음악의 박자 단위로 정하면 컷과 소리가 맞아떨어집니다. 100BPM이면 한 박이 0.6초입니다.',0,'','2, 56','메시지를 전하는 영상은 박자보다 읽기 시간이 먼저입니다. 128BPM 쇼릴 속도로 문장을 넣으면 안 읽힙니다.','BPM을 입력하면 한 박과 한 마디의 길이를 계산하고, 장면 목록을 박자 단위로 배치한 타임라인을 보여주는 도구를 만들어줘.'],

['MV-009','A','font-variation-settings','가변 폰트','글꼴 한 개로 굵기와 폭을 연속으로 바꿉니다. 글자가 숨 쉬듯 두꺼워졌다 얇아집니다.',1,'varfont','7, 1','가변 축이 있는 폰트(예: Noto Sans KR의 wght)를 불러와야 합니다. 일반 폰트는 정해진 굵기로만 바뀝니다.','가변 폰트로 "쉼" 한 글자가 숨 쉬듯 굵기가 변하고, 슬라이더로 굵기를 직접 바꿀 수 있는 페이지를 만들어줘.'],
['MV-010','A','background-clip: text','글자 속 영상','글자를 창문 삼아 뒤에 깔린 그림이나 영상을 보여줍니다. 그다음 글자 속으로 뚫고 들어가면 줌 스루 전환이 됩니다.',0,'textclip','5, 53','배경이 복잡하면 글자 모양이 묻힙니다. 흰 글자로 먼저 읽힌 다음 그림을 채우고, 흰 외곽선으로 모양을 지킵니다.','큰 글자 "바다" 안에 파도 같은 그라데이션이 비치다가, 버튼을 누르면 글자가 커지며 화면 전체가 그 그라데이션으로 바뀌는 줌 스루 전환을 만들어줘. 처음 0.5초는 흰 글자로 보여주고.'],
['MV-011','A','스크램블 디코드','깨진 글자가 해독되며 완성','무작위 글자가 앞에서부터 하나씩 제자리를 찾아갑니다. AI, 보안, 데이터 주제의 오프닝에 잘 맞습니다.',0,'scramble','3','한글은 무작위 글자를 한글 음절에서 고르면 폭이 흔들리지 않습니다. 글자 폭이 다른 문자를 섞으면 줄이 출렁입니다.','입력한 문장이 무작위 한글과 기호로 깨져 있다가 앞에서부터 해독되는 효과와, 한 글자씩 타이핑되는 효과를 버튼으로 골라 보는 페이지를 만들어줘.'],
['MV-012','A','타이핑 커서','한 글자씩 써지는 글','글자를 하나씩 늘려 보여주고 끝에 깜박이는 커서를 붙입니다. 프롬프트 시연, 채팅 장면, 다음 화 예고에 씁니다.',0,'','4, 23','한글은 자모 단위가 아니라 완성된 음절 단위로 늘려야 자연스럽습니다. 타자 소리를 붙이면 몰입감이 커집니다.','채팅 화면에서 사용자가 프롬프트를 타이핑하고, AI가 점 세 개를 보이다가 답을 띄우는 장면을 만들어줘. 타이핑마다 짧은 키보드 소리도 Web Audio로 내줘.'],
['MV-013','A','Intl.Segmenter','한국어 단어 자르기','브라우저에 내장된 분할기로 한국어 문장을 단어나 글자 단위로 정확히 나눕니다. 노래방식 자막의 기초입니다.',0,'karaoke','8','공백으로만 나누면 문장부호가 단어에 붙습니다. granularity를 word로 주고 isWordLike로 걸러냅니다.','Intl.Segmenter로 한국어 문장을 단어로 나누고, 읽는 속도에 맞춰 단어가 하나씩 노란색으로 칠해지는 노래방식 자막을 만들어줘.'],
['MV-014','A','split + stagger','키네틱 타이포','문장을 단어로 쪼개 시간차를 두고 등장시키고, 핵심 단어에 하이라이트 바를 쓸어 지나가게 합니다.',0,'kinetic','1, 2, 52','한 화면에 강조는 한 군데만. 문장 노출 시간은 0.35초 + 글자 수 ÷ 10초 이상이어야 읽힙니다.','문장을 입력하고 강조할 단어를 *별표*로 감싸면, 단어가 아래에서 흐릿하게 올라오며 등장하고 강조 단어에 코랄색 바가 쓸고 지나가는 키네틱 타이포를 만들어줘.'],
['MV-015','A','<textPath>','길을 따라 흐르는 글자','SVG 곡선 위에 글자를 얹고 시작 위치를 움직여 길을 따라 흐르게 합니다.',0,'','13, 27','곡선이 급하게 꺾이면 한글이 겹칩니다. 완만한 곡선과 넉넉한 자간을 씁니다.','SVG 곡선을 따라 "대본 · 나레이션 · 화면 · 자막"이 계속 흘러가는 띠 애니메이션을 만들어줘.'],

['MV-016','C','stroke-dashoffset','선이 그려지는 애니메이션','SVG 선의 점선 간격을 선 길이만큼 주고 위치를 줄이면, 펜으로 그리는 것처럼 선이 나타납니다. 화이트보드 영상의 핵심입니다.',0,'draw','17, 18, 27','선 길이는 getTotalLength()로 재야 정확합니다. 채워진 도형은 외곽선만 먼저 그리고 채우기를 나중에 켭니다.','노드 세 개와 화살표로 된 도식을 SVG로 그리고, 다시 그리기 버튼을 누르면 선이 순서대로 펜으로 그려지는 애니메이션을 만들어줘.'],
['MV-017','C','Rough.js','손그림 스타일 도식','도형을 삐뚤빼뚤한 손그림 선으로 그려 줍니다. 딱딱한 도식이 칠판 그림처럼 친근해집니다.',1,'rough','17, 25','같은 도형도 그릴 때마다 모양이 바뀝니다. 영상용으로는 seed 값을 고정해야 프레임마다 떨리지 않습니다.','Rough.js로 "대본 → 나레이션 → 렌더 → 자막 → 영상" 흐름도를 손그림으로 그리고, 선이 차례로 그려지게 해줘. 거칠기 슬라이더도 넣어줘.'],
['MV-018','C','Mermaid','글로 쓰면 그려지는 도식','간단한 텍스트 문법으로 흐름도와 순서도를 쓰면 그림이 됩니다. AI가 가장 쓰기 쉬운 그림 언어입니다.',1,'','18','그려진 결과는 정적인 그림입니다. 등장 애니메이션은 결과 SVG의 선과 상자에 따로 입힙니다.','Mermaid로 그린 흐름도의 상자와 화살표가 순서대로 나타나도록, 렌더된 SVG 요소에 시간차 애니메이션을 입혀줘.'],
['MV-019','C','Canvas 2D','픽셀 그림판','수천 개의 도형이나 점을 빠르게 그립니다. 차트, 파형, 입자, 영상 필터가 모두 여기서 시작합니다.',0,'','9, 10, 16','글자를 많이 그리면 흐려 보일 수 있습니다. 화면 배율(devicePixelRatio)만큼 캔버스를 키워 그립니다.','Canvas 2D로 숫자가 0에서 목표값까지 올라가는 카운터와 막대 차트가 함께 자라는 장면을 만들어줘. 고해상도 화면에서도 선명하게.'],
['MV-020','C','clip-path','모양으로 오려내기','원, 다각형, 사선으로 요소를 오려냅니다. 값을 움직이면 와이프나 조리개 전환이 됩니다.',0,'','45, 54','복잡한 경로는 성능이 떨어집니다. 전환 정도는 inset()이나 polygon() 몇 개 점이면 충분합니다.','clip-path로 사선 와이프, 원형 조리개, 블라인드 세 가지 장면 전환을 버튼으로 비교하는 페이지를 만들어줘.'],
['MV-021','C','feTurbulence','종이와 필름 질감','SVG 필터로 노이즈를 만들어 필름 그레인, 수채화 번짐, 물결 왜곡을 줍니다. 디지털 화면이 손맛을 얻습니다.',0,'','28, 48','큰 화면 전체에 실시간으로 걸면 무겁습니다. 영상 렌더에서는 프레임마다 seed만 바꿔 줍니다.','SVG feTurbulence와 feDisplacementMap으로 글자가 물결처럼 일렁이는 효과와, 화면 위 필름 그레인을 켜고 끄는 페이지를 만들어줘.'],
['MV-022','C','D3 transition','데이터 차트 애니메이션','데이터가 바뀌면 막대와 선이 새 값으로 부드럽게 옮겨 갑니다. 바 차트 레이스와 지도 애니메이션의 엔진입니다.',1,'','10, 11, 12','D3는 배우는 데 시간이 듭니다. 간단한 차트는 Canvas나 CSS로, 순위가 바뀌는 차트만 D3로 만듭니다.','D3로 연도별 순위가 바뀌는 바 차트 레이스를 만들어줘. 막대는 순위가 바뀔 때 자리를 옮기고 숫자는 카운트업되게.'],
['MV-023','C','mix-blend-mode','합성 모드','겹친 레이어끼리 곱하기, 차이, 스크린으로 섞습니다. 듀오톤 영상, 사진 위 반전 글자에 씁니다.',0,'','57, 52','배경이 투명하면 효과가 안 보입니다. 섞일 대상이 같은 쌓임 맥락(isolation)에 있어야 합니다.','사진 위에 큰 글자를 mix-blend-mode: difference로 얹어 배경에 따라 글자 색이 반전되는 표지를 만들어줘.'],

['MV-024','E','getImageData 입자','글자가 입자로 흩어졌다 모이기','글자를 보이지 않는 캔버스에 그린 뒤 점의 위치를 읽어, 수천 개 입자가 그 모양으로 모이게 합니다.',0,'particles','35','점을 너무 촘촘히 뽑으면 느려집니다. 몇 픽셀 간격으로 건너뛰며 뽑습니다.','입력한 글자 모양으로 입자 수천 개가 모였다가 버튼을 누르면 흩어지는 캔버스 애니메이션을 만들어줘.'],
['MV-025','E','Matter.js','물리 엔진','블록이 떨어지고 쌓이고 무너집니다. "할 일이 와르르 쏟아진다" 같은 장면을 손으로 움직이지 않고 물리로 만듭니다.',1,'physics','15, 37','물리 결과는 실행할 때마다 조금씩 다릅니다. 영상용으로는 한 번 계산한 위치를 기록해 두고 재생합니다.','Matter.js로 물건 이름이 적힌 블록들이 장바구니 위로 떨어져 쌓이고, 버튼을 누르면 와르르 무너지는 장면을 만들어줘. 블록에 글자가 보이게 직접 그려줘.'],
['MV-026','E','CSS 3D transform','CSS만으로 입체','perspective와 rotateX·Y로 카드를 공간에 띄우고 돌립니다. 3D 라이브러리 없이 갤러리와 큐브를 만듭니다.',0,'','36','부모에 transform-style: preserve-3d가 없으면 납작해집니다. 뒷면은 backface-visibility로 숨깁니다.','CSS 3D transform만으로 카드 여섯 장이 원형으로 떠서 천천히 회전하는 갤러리를 만들어줘.'],
['MV-027','E','three.js','3D 장면','브라우저의 그래픽 기능으로 조명, 카메라, 재질이 있는 3D 공간을 만듭니다. 카메라를 시간에 따라 움직이면 플라이스루 영상이 됩니다.',1,'three','31~38','버전마다 문법이 다릅니다. 예제와 같은 버전을 쓰고, 카메라 위치도 시간으로만 계산합니다.','three.js로 빛나는 타일 수천 개가 바다처럼 깔리고 물결처럼 밝아졌다 어두워지며, 카메라가 천천히 날아가는 장면을 만들어줘.'],
['MV-028','E','InstancedMesh','수천 개를 한 번에','같은 모양 수천 개를 한 번에 그려 빠릅니다. 타일 바다, 데이터 도시, 군중 표현에 씁니다.',1,'','31, 37','개별 색은 setColorAt으로 바꾸고 instanceColor.needsUpdate를 켜야 반영됩니다.','three.js InstancedMesh로 막대 2,500개가 데이터 값만큼 솟아오르는 3D 막대 도시를 만들어줘.'],
['MV-029','E','UnrealBloomPass','빛 번짐','밝은 부분이 번져 빛나게 합니다. 3D 장면이 고급스럽게 보이는 이유의 절반입니다.',1,'','31','그래픽카드가 없는 서버에서 렌더하면 1프레임에 1~2초 걸립니다. 무거운 3D는 내 PC에서 렌더합니다.','three.js 장면에 EffectComposer와 UnrealBloomPass를 붙여 네온처럼 빛나는 글자와 타일을 만들어줘.'],
['MV-030','E','WebGPU','차세대 그래픽','WebGL보다 빠른 그래픽 기능으로 수십만 개 입자와 계산을 돌립니다.',0,'','35, 38','지원 기기와 브라우저가 아직 한정적입니다. 지원 여부를 먼저 검사하고 WebGL로 대체합니다.','WebGPU 지원 여부를 검사하고, 지원하면 입자 10만 개를, 아니면 WebGL로 1만 개를 그리는 페이지를 만들어줘.'],

['MV-031','F','<video> 클립 배경','영상 클립을 장면 배경으로','영상을 장면 뒤에 깔고 그 위에 자막과 도장을 올립니다. 영상은 상자에 가두지 않고 늘 화면 전체로 씁니다.',0,'','40, 51, 54','영상의 currentTime은 프레임 단위로 정확하지 않습니다. 영상 렌더에서는 미리 이미지 시퀀스로 풀어서 씁니다.','영상 파일을 끌어다 놓으면 화면 전체 배경으로 재생되고, 아래에 영화 자막처럼 문장이 차례로 뜨는 페이지를 만들어줘.'],
['MV-032','F','drawImage(video)','영상 필터','영상을 캔버스에 매 프레임 그려 픽셀을 바꿉니다. 듀오톤, 흑백, 모자이크를 영상에 실시간으로 입힙니다.',0,'duotone','57, 54','다른 사이트의 영상은 보안 때문에 픽셀을 읽을 수 없습니다. 내 파일이나 허용된 출처의 영상만 씁니다.','영상이나 사진 파일을 고르면 두 가지 색으로 물든 듀오톤으로 바꿔 보여주고, 두 색을 고를 수 있는 페이지를 만들어줘.'],
['MV-033','F','requestVideoFrameCallback','영상 프레임에 정확히 맞추기','영상의 새 프레임이 화면에 나올 때마다 알려 줍니다. 영상 위 그래픽을 프레임 단위로 맞출 때 씁니다.',0,'','51, 58','파이어폭스 등 일부에서 지원하지 않습니다. 없으면 requestAnimationFrame으로 대체합니다.','영상 위에 캔버스를 겹치고 requestVideoFrameCallback으로 프레임마다 시간과 프레임 번호를 그려주는 페이지를 만들어줘.'],
['MV-034','F','ImageSegmenter','사람과 물체 오려내기','사진에서 사람이나 물체만 오려 층으로 나눕니다. 사진 한 장을 2.5D 입체 장면으로 만드는 첫 단계입니다.',1,'','39, 40','모델 파일이 커서 처음 불러올 때 시간이 걸립니다. 1편의 BR-087, BR-088과 같은 기술입니다.','사진을 올리면 MediaPipe ImageSegmenter로 사람을 오려 배경과 분리하고, 두 층이 서로 다른 속도로 움직이는 패럴랙스를 만들어줘.'],
['MV-035','F','depth-estimation','깊이로 만드는 2.5D','사진 한 장에서 AI가 픽셀마다 거리를 추정합니다. 가까운 곳과 먼 곳을 다르게 움직여 사진이 입체로 살아납니다.',1,'','39','추정 깊이는 경계가 흐립니다. 흔들림을 작게 주어야 가장자리가 찢어지지 않습니다.','transformers.js 깊이 추정으로 사진의 깊이 지도를 만들고, 마우스 위치에 따라 사진이 입체적으로 흔들리는 효과를 만들어줘.'],
['MV-036','F','Pexels API','무료 실사 영상 가져오기','검색어로 무료 스톡 사진과 영상을 받아 장면 배경으로 씁니다. 문장마다 어울리는 B-roll을 자동으로 고릅니다.',2,'','51~61','기본 한도는 시간당 200회, 월 2만 회입니다. 사람이 나오는 영상을 풍자 역할로 쓰지 말고, Pexels와 촬영자를 표기합니다. 키는 페이지에 넣지 말고 내 PC에서만 씁니다.','대본 문장마다 검색어를 뽑아 Pexels API에서 가로 영상을 찾아 목록으로 보여주고, 촬영자 크레딧을 함께 모아주는 도구를 만들어줘. API 키는 입력창으로 받고 저장하지 않게.'],
['MV-037','F','프리즈 + 도장','정지 화면에 도장 찍기','움직이던 장면을 멈추고 흑백으로 빼면서 그 위에 빨간 도장을 쾅 찍습니다. 코미디 영화의 프리즈 프레임 문법입니다.',0,'freeze','54','도장 소리와 멈춤이 같은 순간에 와야 웃깁니다. 멈춤 직전에 레코드 스크래치를 넣으면 더 좋습니다.','움직이는 장면 위에 버튼을 누르면 화면이 멈추고 흑백으로 바뀌며 빨간 도장 "팩트체크: 조작된 사진"이 쾅 찍히는 효과를 만들어줘. 도장 소리도 Web Audio로.'],

['MV-038','S','OscillatorNode','음원 없이 만드는 배경음악','코드로 음을 만들어 장면별 음악을 합성합니다. 저작권 걱정 없이 코믹, 무거움, 따뜻함을 바꿔 깔 수 있습니다.',0,'bgm','전체','브라우저는 사용자가 누르기 전에 소리를 못 냅니다. 첫 재생은 버튼 클릭에서 시작합니다.','Web Audio로 밝은 코믹(마림바와 박수), 무거운 단조, 따뜻한 피아노 세 가지 배경음악을 합성하고 버튼으로 바꿔 듣는 페이지를 만들어줘. 소리 파형 시각화도 넣어줘.'],
['MV-039','S','AudioBuffer 노이즈','효과음 합성','잡음과 짧은 음으로 도장 쾅, 와르르, 띵, 휙, 레코드 스크래치를 만듭니다. 효과음 파일이 필요 없습니다.',0,'sfx','전체','효과음이 음악보다 크면 피곤합니다. 효과음은 짧게, 음악은 효과음 순간에 살짝 줄입니다.','Web Audio로 도장 쾅, 와르르, 알림 띵, 휙, 레코드 스크래치 효과음을 각각 버튼으로 내는 효과음 판을 만들어줘. 파일 없이 코드로.'],
['MV-040','S','AnalyserNode','소리를 그림으로','소리를 주파수별로 나눠 막대나 파형으로 그립니다. 팟캐스트를 영상으로 만드는 오디오그램의 기초입니다.',0,'bgm','49','소리가 작으면 막대도 작습니다. getByteFrequencyData 값에 비율을 곱해 보기 좋게 키웁니다.','마이크나 오디오 파일 소리를 막대 시각화로 보여주고 아래에 자막이 뜨는 오디오그램 화면을 만들어줘.'],
['MV-041','S','speechSynthesis','기기 목소리로 나레이션','브라우저에 들어 있는 목소리로 문장을 읽습니다. 무료이고 설치가 없습니다.',0,'tts','51, 49','목소리 종류와 품질이 기기마다 다릅니다. 읽어 주는 소리는 영상 파일에 바로 담기지 않아, 영상 나레이션은 TTS 파일로 따로 만듭니다.','한국어 목소리 목록을 보여주고 고른 목소리와 속도로 문장을 읽어주는 나레이션 연습 페이지를 만들어줘.'],
['MV-042','S','kokoro-js · edge-tts','고품질 무료 TTS','브라우저 안 음성 모델이나 무료 TTS 도구로 자연스러운 나레이션 파일을 만듭니다.',3,'','51','모델마다 한국어 지원이 다릅니다. edge-tts는 무료지만 비공식 방식이라 상업 이용 전 약관을 확인합니다.','대본을 문장 단위로 나눠 각 문장을 TTS 음성 파일로 만들고, 문장별 길이를 JSON으로 저장하는 스크립트를 만들어줘.'],

['MV-043','V','<track> WebVTT','영상 자막 파일','영상에 자막 파일을 붙여 재생 시간에 맞춰 보여줍니다. 유튜브에 올리는 자막과 같은 형식입니다.',0,'','51, 61','파일 첫 줄에 WEBVTT가 있어야 하고, 시간은 00:00:01.000 형식입니다. SRT와는 쉼표와 점이 다릅니다.','영상과 자막 텍스트를 넣으면 WebVTT를 만들어 <track>으로 붙여 재생하고, SRT로도 바꿔 보여주는 페이지를 만들어줘.'],
['MV-044','V','문장 길이 타이밍','대본에서 자막과 장면 길이 계산','문장 글자 수로 읽는 시간을 추정해 자막 시간표와 SRT를 만듭니다. 장면 길이가 목소리에 맞춰 자동으로 늘고 줄어듭니다.',0,'srt','전체','TTS 속도와 추정이 다를 수 있습니다. 실제 음성 파일 길이를 재서 바꾸는 것이 가장 정확합니다.','대본을 붙여 넣으면 문장마다 시작과 끝 시간을 계산해 표와 SRT로 보여주고, 한 줄이 너무 길면 경고해주는 도구를 만들어줘.'],
['MV-045','V','onboundary','읽는 단어 따라가기','기기 목소리가 지금 읽는 단어의 위치를 알려 줍니다. 노래방식 자막을 목소리와 정확히 맞춥니다.',0,'karaoke','8','일부 목소리는 단어 위치를 알려 주지 않습니다. 그럴 때는 글자 수로 추정한 타이밍으로 대체합니다.','speechSynthesis의 onboundary 이벤트로 지금 읽는 단어를 강조하고, 이벤트가 오지 않으면 추정 타이밍으로 강조하는 낭독 페이지를 만들어줘.'],
['MV-046','V','읽기 시간 검사','메시지가 읽히는 속도 지키기','문장마다 0.35초 + 글자 수 ÷ 10초 이상 보이는지 검사합니다. 모션은 좋은데 메시지가 안 들어오는 영상을 막습니다.',0,'srt','전체','강조 문장 하나에 너무 많은 글자를 넣지 않습니다. 길면 두 장면으로 나눕니다.','장면 목록(문장, 등장 시각, 장면 끝 시각)을 넣으면 문장마다 노출 시간이 충분한지 검사하고 부족한 곳을 빨갛게 표시하는 검사기를 만들어줘.'],

['MV-047','R','captureStream + MediaRecorder','캔버스를 그대로 녹화','캔버스 애니메이션을 실시간으로 녹화해 영상 파일로 만듭니다. 이 페이지에서 바로 해 볼 수 있습니다.',0,'record','전체','실시간 녹화라 컴퓨터가 버벅이면 영상도 끊깁니다. 결과는 보통 webm이라 mp4가 필요하면 변환합니다.','캔버스에 키네틱 타이포 애니메이션을 그리고, 녹화 버튼을 누르면 3초간 녹화해서 바로 아래 영상으로 재생하는 페이지를 만들어줘.'],
['MV-048','R','VideoEncoder','프레임 단위로 정확한 인코딩','WebCodecs로 render(t)가 그린 프레임을 하나씩 인코딩해 끊김 없는 mp4를 만듭니다. 실시간이 아니라 정확합니다.',1,'','전체','지원 브라우저를 확인하고, mp4로 묶으려면 mp4-muxer 같은 라이브러리를 함께 씁니다.','render(t)로 그린 캔버스를 WebCodecs VideoEncoder로 30fps 프레임마다 인코딩하고 mp4-muxer로 mp4 파일을 만드는 페이지를 만들어줘.'],

    <div class="cta">${demo?`<a class="btn btn-primary" href="#" data-jump="try">${ICON.play}바로 체험</a>`:''}<button class="btn btn-secondary" id="cp">${ICON.copy}프롬프트 복사</button></div>
  </div>
  <aside class="factbox surf"><dl><dt>번호</dt><dd class="num">${ID}</dd><dt>분류</dt><dd>${CATS[c][0]}</dd><dt>상태</dt><dd>${demo?'바로 체험':'프롬프트로 만들기'}</dd><dt>영상 유형</dt><dd>${types==='전체'?'모든 유형의 바탕':'#'+types}</dd><dt>의존도</dt><dd>${depChip(dep)}</dd></dl></aside></section>
  <section class="s"><h2>의존도</h2><p class="sd">${['서버 없이 브라우저 기본 기능만 씁니다.','라이브러리를 CDN 한 줄로 불러옵니다. 인터넷 연결이 필요합니다.','외부 서비스의 API 키가 필요합니다. 키는 페이지에 넣지 말고 내 PC에서만 씁니다.','브라우저 밖의 도구(파이썬, Node, ffmpeg 등)를 내 PC에서 함께 씁니다.'][dep]}</p><div class="ladder">${DEPS.map(([n],k)=>`<span class="${k===dep?'on':k<dep?'past':''}">${n}</span>`).join('')}</div></section>
  <section class="s" id="try"><h2>바로 체험</h2><p class="sd">${demo?'이 페이지 안에서 바로 실행됩니다. 소리가 나는 체험은 버튼을 눌러야 시작합니다.':'이 능력은 아래 프롬프트를 코딩 에이전트에게 주고 직접 만들어 보세요.'}</p>${demo?'<div class="stage" id="stage"></div>':'<div class="nodemo">체험 없이 프롬프트로 만드는 능력입니다.</div>'}</section>
  <section class="s two"><div class="box surf"><h3>쓰는 브라우저 기술</h3><div class="chips"><span class="chip mono">${esc(key)}</span></div></div><div class="box surf"><h3>연결되는 영상 유형</h3><p>${types==='전체'?'특정 유형이 아니라 모든 영상 유형의 바탕이 되는 능력입니다.':`<a href="https://claude.ai/artifact/XGRPiAJ9fh2e9CopM2U6Uu" target="_blank" rel="noopener">모션 영상 유형 사전</a>의 #${types}번 유형을 만들 때 씁니다.`}</p></div></section>
  <section class="s"><div class="warn"><h3>자주 막히는 곳</h3><p>${esc(pit)}</p></div></section>
  <section class="s"><h2>코딩 에이전트에게 이렇게 시키세요</h2><p class="sd">복사해서 Claude 같은 코딩 에이전트에 붙여 넣으면 됩니다.</p><div class="prompt surf"><p id="ptext"></p><button class="btn btn-primary" id="cp2">${ICON.copy}프롬프트 복사</button></div></section>
  <nav class="pn" aria-label="이전과 다음">${prev?`<a href="#${prev[0].toLowerCase()}"><span class="over">이전 ${prev[0]}</span><b>${esc(prev[3])}</b></a>`:'<span></span>'}${next?`<a href="#${next[0].toLowerCase()}"><span class="over">다음 ${next[0]}</span><b>${esc(next[3])}</b></a>`:''}</nav>`;
  $('#ptext').textContent=pr;
  $('#cp').onclick=$('#cp2').onclick=()=>copy(pr,'프롬프트를 복사했습니다');
  $$('[data-cat]').forEach(a=>a.onclick=e=>{e.preventDefault();F.cat=a.dataset.cat;location.hash='';});
  if(demo&&DEMOS[demo]){try{cleanup=DEMOS[demo]($('#stage'))}catch(err){$('#stage').innerHTML='<p class="note">이 브라우저에서는 체험을 실행할 수 없습니다.</p>'}}
}
function route(){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  const h=location.hash.slice(1);const i=D.findIndex(d=>d[0].toLowerCase()===h);
  if(i>=0){detailView(i);window.scrollTo(0,0);$('#swAll').classList.add('on');$('#swDemo').classList.remove('on');return}
  if(h==='demo')F.demo=true;else if(h==='')F.demo=F.demo&&false;
  listView();
}
document.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth'})}});
$('#swAll').onclick=e=>{e.preventDefault();F.demo=false;if(location.hash){location.hash=''}else listView()};
$('#swDemo').onclick=e=>{e.preventDefault();if(location.hash==='#demo'){F.demo=true;listView()}else location.hash='demo'};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){const q=$('#q');if(q){e.preventDefault();q.focus()}}});
addEventListener('hashchange',route);route();
const root=document.documentElement;try{const t=localStorage.getItem('theme');if(t==='light')root.setAttribute('data-theme','light')}catch(e){}
$('#theme').onclick=()=>{const l=root.getAttribute('data-theme')==='light';if(l)root.removeAttribute('data-theme');else root.setAttribute('data-theme','light');try{localStorage.setItem('theme',l?'dark':'light')}catch(e){}};

</script>
</body>
</html>
