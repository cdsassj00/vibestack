# PR 이 열리거나 갱신되면 Firebase Hosting 미리보기 채널에 배포하고 URL 을 PR 코멘트로 남긴다.
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT_AG_FIREBASE_BOARD_2026
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AG_FIREBASE_BOARD_2026 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret 미설정 안내
        if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_AG_FIREBASE_BOARD_2026 Secret이 없어 미리보기 배포를 건너뜁니다."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AG_FIREBASE_BOARD_2026 }}
          projectId: ag-firebase-board-2026
