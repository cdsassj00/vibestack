<script>

const $ = s => document.querySelector(s);
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, v, f2){ const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); }
let _tt = 0;

async function micAnalyser(fft){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 마이크를 쓸 수 없습니다.');

}

const MPV = {vision:'0.10.14', audio:'0.10.14', text:'0.10.14', genai:'0.10.25'};
async function exists(u){ try{ const r = await fetch(u, {method:'HEAD', cache:'no-store'}); return r.ok; }catch(e){ return false; } }

async function mpLoad(kind){
  const local = 'libs/mediapipe/tasks-' + kind, cdn = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-' + kind + '@' + MPV[kind];

  const base = useLocal ? new URL(local, location.href).href : cdn;
  const mod = await import(base + '/' + kind + '_bundle.mjs');
  const fn = {vision:'forVisionTasks', audio:'forAudioTasks', text:'forTextTasks', genai:'forGenAiTasks'}[kind];
  const fs = await mod.FilesetResolver[fn](base + '/wasm');
  return {mod, fs};

async function mpModel(path){
  const l = 'libs/mediapipe/models/' + path.split('/').pop();
  return (await exists(l)) ? new URL(l, location.href).href : 'https://storage.googleapis.com/mediapipe-models/' + path;

  catch(e){ return await Cls.createFromOptions(fs, {...opts, baseOptions:{...opts.baseOptions, delegate:'CPU'}}); }
}
function srcNote(){ return MP_LOCAL ? '이 기기에 저장된 모델로 실행 중' : '모델을 인터넷에서 받아 실행 중'; }

let st = null, stream = null; const sc = $('#src'), sx = sc.getContext('2d'), dc = $('#dst'), dx2 = dc.getContext('2d');
async function start(){ $('#status').textContent = '얼굴 스타일 모델 준비 중 (약 30MB)…'; const {mod, fs} = await mpLoad('vision'); st = await mod.FaceStylizer.createFromOptions(fs, {baseOptions:{modelAssetPath: await mpModel('face_stylizer/blaze_face_stylizer/float32/latest/face_stylizer_color_sketch.task')}}); }
function run(srcCanvas){
  sc.width = srcCanvas.width; sc.height = srcCanvas.height; sx.drawImage(srcCanvas, 0, 0);
  toast('변환하는 중…', 1500);
  setTimeout(() => { try{ const out = st.stylize(sc); if(!out){ toast('얼굴을 찾지 못했습니다. 얼굴이 크게 나온 사진을 써 보세요', 3500); return; }
    const img = out.getAsImageData ? out.getAsImageData() : null; if(img){ dc.width = img.width; dc.height = img.height; dx2.putImageData(img, 0, 0); } else { dc.width = out.width; dc.height = out.height; dx2.drawImage(out.canvas || out.getAsImageBitmap(), 0, 0); }
    out.close && out.close(); $('#dl').href = dc.toDataURL('image/png'); $('#dl').style.display = 'inline-block'; tone(880, .1); }catch(e){ console.error(e); toast('변환에 실패했습니다. 다른 사진으로 해 보세요', 3500); } }, 50);
}
$('#file').onchange = async e => { const f = e.target.files[0]; if(!f || !st) return; const im = new Image(); im.src = URL.createObjectURL(f); await im.decode(); const cv = document.createElement('canvas'), s = Math.min(1, 900/Math.max(im.naturalWidth, im.naturalHeight)); cv.width = im.naturalWidth*s; cv.height = im.naturalHeight*s; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); run(cv); };
$('#snap').onclick = async () => {
  const v = $('#v');
  if(!stream){ try{ stream = await camera('user'); }catch(e){ toast('카메라 권한이 필요합니다'); return; } v.srcObject = stream; await v.play(); $('#snap').textContent = '지금 찍기'; const tick = () => { if(!stream) return; sc.width = v.videoWidth; sc.height = v.videoHeight; sx.save(); sx.translate(sc.width, 0); sx.scale(-1, 1); sx.drawImage(v, 0, 0); sx.restore(); requestAnimationFrame(tick); }; tick(); return; }
  const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight; const cx2 = cv.getContext('2d'); cx2.translate(cv.width, 0); cx2.scale(-1, 1); cx2.drawImage(v, 0, 0); stream.getTracks().forEach(t => t.stop()); stream = null; $('#snap').textContent = '카메라로 찍기'; run(cv);
};

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
<script>(function(){var b=document.getElementById('xtheme');if(b)b.addEventListener('click',function(){var l=document.documentElement.getAttribute('data-theme')==='light';if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme',l?'dark':'light');}catch(e){}});})();</script>
