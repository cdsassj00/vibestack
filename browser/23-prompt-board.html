<script>

const $ = s => document.querySelector(s);
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, v, f2){ const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); }
let _tt = 0;

}

const BASE = [
 ['진동','버튼을 누르면 휴대폰이 SOS 패턴으로 진동하는 웹페이지를 HTML 파일 하나로 만들어줘. 아이폰처럼 진동이 안 되는 기기에서는 안내 문구를 보여줘.'],
 ['마이크','마이크 소리 크기에 따라 초록·노랑·빨강 신호등이 바뀌는 교실 소음 신호등 웹페이지를 만들어줘. 기준값은 슬라이더로 조절하게 해줘.'],

 ['카메라','AI 모델 없이 카메라 직전 프레임과 픽셀을 비교해서, 움직인 곳에서만 불꽃 파티클이 피어오르는 거울 웹페이지를 만들어줘.'],

 ['화면','적은 글자가 LED 전광판처럼 화면 가득 흘러가는 전체화면 웹페이지를 만들어줘. 색과 속도를 고를 수 있게 해줘.']
];
let mine = []; try{ mine = JSON.parse(localStorage.getItem('myPrompts') || '[]'); }catch(e){}
async function start(){ render(); }
function render(){
  const q = $('#q').value.trim(), g = $('#grid'); g.innerHTML = '';
  [...mine.map(t => ['내 카드', t]), ...BASE].filter(([k,t]) => !q || (k + t).includes(q)).forEach(([k,t]) => {
    const b = document.createElement('button'); b.className = 'pc'; b.innerHTML = '<em>' + k + '</em><span></span><b>눌러서 복사</b>'; b.querySelector('span').textContent = t;
    b.onclick = async () => { try{ await navigator.clipboard.writeText(t); b.classList.add('copied'); b.querySelector('b').textContent = '복사했습니다'; toast('복사했습니다. AI 채팅창에 붙여 넣으세요'); setTimeout(() => { b.classList.remove('copied'); b.querySelector('b').textContent = '눌러서 복사'; }, 1600); }catch(e){ toast('복사 권한이 막혀 있습니다'); } };
    g.appendChild(b);
  });
}
$('#q').oninput = render;
$('#paste').onclick = async () => { try{ $('#mine').value = await navigator.clipboard.readText(); }catch(e){ toast('클립보드 읽기 권한이 필요합니다'); } };
$('#addc').onclick = () => { const t = $('#mine').value.trim(); if(!t) return; mine.unshift(t); try{ localStorage.setItem('myPrompts', JSON.stringify(mine)); }catch(e){} $('#mine').value = ''; render(); toast('카드로 저장했습니다'); };

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
<script>(function(){var b=document.getElementById('xtheme');if(b)b.addEventListener('click',function(){var l=document.documentElement.getAttribute('data-theme')==='light';if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme',l?'dark':'light');}catch(e){}});})();</script>
