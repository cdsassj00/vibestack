<canvas id="c"></canvas>
<div class="cdsa-bn" role="banner"><a href="https://cdsa.kr" target="_blank" rel="noopener"><b>한국데이터사이언티스트협회</b><span class="long">홈페이지 바로가기</span><span class="u">cdsa.kr</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div><header class="xhdr"><div class="in"><a aria-label='브라우저 능력 사전으로' class='xbrand' href='/browser/stack/'><i><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></i></a><div class="xttl"><span class="n">04</span><h1>입김으로 촛불 끄기</h1></div><a class='btn btn-ghost btn-sm xback' href='/browser/stack/'>능력 사전</a><div class="xstats"><div class="panel"><span style="font-size:.78rem;color:var(--muted)">바람 세기 · <span id="msg">마이크에 "후" 불어 보세요</span></span><div class="meter"><i id="wind"></i><b></b></div></div></div><button class="btn btn-ghost btn-icon" id="xtheme" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>

<div class="layer" id="start">
  <div>
    <span class="tag">마이크</span><span class="tag">Web Audio 저음 분석</span><span class="tag">PC·휴대폰</span>
    <h2>입김으로 촛불 끄기</h2>
    <p>마이크에 대고 "후" 하고 불면 바람 소리의 낮은 주파수를 분석해 촛불이 흔들리다 꺼집니다. 세게, 길게 불수록 많이 꺼집니다. 모두 끄면 축하 노래가 나옵니다. 휴대폰은 아래쪽 마이크 구멍에 불면 잘 됩니다.</p>
    <button class="go" id="go">마이크 켜고 시작</button>
    <div class="status" id="status"></div>
  </div>

<script>
(function(){
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); }
fit(); addEventListener('resize', fit);
let AC, an, fb, tb, N = 5, candles = [], smoke = [], confetti = [], wind = 0, celebrated = false;
function makeCandles(){ candles = []; for(let i=0;i<N;i++) candles.push({life:1, ph:Math.random()*10, col:['#FF8FA3','#7DB3FF','#9BE37B','#FFD34D','#C59BFF'][i%5]}); celebrated = false; confetti = []; }
makeCandles();
function tone(f, d, type, v){ const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05); }
function song(){
  const C = 261.63, n = s => C*Math.pow(2, s/12);
  const mel = [[7,.3],[7,.15],[9,.45],[7,.45],[12,.45],[11,.9],[7,.3],[7,.15],[9,.45],[7,.45],[14,.45],[12,.9]];
  let t = 0; mel.forEach(([s,d]) => { setTimeout(() => tone(n(s), d*1.4, 'triangle', .22), t*1000); t += d; });
}
$('#go').onclick = async () => {
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    an = AC.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .2; AC.createMediaStreamSource(s).connect(an);
    fb = new Uint8Array(an.frequencyBinCount); tb = new Float32Array(an.fftSize);
  }catch(e){ $('#status').textContent = '마이크를 켤 수 없습니다. 브라우저 마이크 권한을 허용해 주세요.'; return; }
  $('#start').style.display = 'none';
};
$('#relight').onclick = () => { makeCandles(); if(AC) [0,1,2].forEach(i => setTimeout(() => tone(1400 + i*200, .08, 'square', .05), i*70)); };
$('#plus').onclick = () => { N = Math.min(12, N + 1); makeCandles(); };
$('#minus').onclick = () => { N = Math.max(1, N - 1); makeCandles(); };

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; const t = now/1000;
  let strength = 0;
  if(an){
    an.getByteFrequencyData(fb); an.getFloatTimeDomainData(tb);
    let s2 = 0; for(let i=0;i<tb.length;i++) s2 += tb[i]*tb[i]; const rms = Math.sqrt(s2/tb.length);
    const top = Math.max(3, Math.floor(800/(AC.sampleRate/an.fftSize))); let sum = 0; for(let i=1;i<top;i++) sum += fb[i];
    const low = sum/(top-1)/255;
    strength = rms > 0.04 ? Math.max(0, (low - 0.45)/0.4) : 0;
  }
  wind = wind*0.8 + Math.min(1, strength)*0.2;
  $('#wind').style.width = (wind*100) + '%';
  $('#msg').textContent = !an ? '마이크를 켜 주세요' : wind > .35 ? '좋아요, 계속!' : wind > .1 ? '조금 더 세게' : '"후" 불어 보세요';

  /* 배경 */
  const bg = x.createRadialGradient(W/2, H*0.55, 0, W/2, H*0.55, Math.max(W,H)*0.7);
  const lit = candles.filter(c => c.life > 0).length/N;
  bg.addColorStop(0, 'rgba(' + (60 + 90*lit|0) + ',' + (40 + 50*lit|0) + ',' + (30 + 10*lit|0) + ',1)'); bg.addColorStop(1, '#07090E');
  x.fillStyle = bg; x.fillRect(0,0,W,H);

  /* 케이크 */
  const s = Math.min(W, H*1.2), cw = s*0.62, cx = W/2, base = H*0.84;
  x.fillStyle = '#F4E1C6'; x.beginPath(); x.ellipse(cx, base, cw*0.6, cw*0.08, 0, 0, Math.PI*2); x.fill();
  x.fillStyle = '#8B4A2B'; x.fillRect(cx - cw/2, base - cw*0.32, cw, cw*0.32);
  x.fillStyle = '#B5653B'; x.beginPath(); x.ellipse(cx, base, cw/2, cw*0.06, 0, 0, Math.PI); x.fill();
  x.fillStyle = '#FFF4F7'; x.beginPath(); x.ellipse(cx, base - cw*0.32, cw/2, cw*0.07, 0, 0, Math.PI*2); x.fill();
  for(let i=0;i<9;i++){ const dx = cx - cw/2 + cw*(i+0.5)/9; x.beginPath(); x.ellipse(dx, base - cw*0.3, cw*0.03, cw*0.05, 0, 0, Math.PI*2); x.fill(); }
  x.fillStyle = '#E8445A'; for(let i=0;i<7;i++){ x.beginPath(); x.arc(cx - cw*0.36 + cw*0.72*i/6, base - cw*0.16, cw*0.018, 0, Math.PI*2); x.fill(); }

  /* 초 */
  const topY = base - cw*0.33, ch = cw*0.22, cwid = cw*0.035;
  candles.forEach((cd, i) => {
    const px = cx - cw*0.38 + (N === 1 ? cw*0.38 : cw*0.76*i/(N-1));
    x.fillStyle = cd.col; x.fillRect(px - cwid/2, topY - ch, cwid, ch);
    x.fillStyle = 'rgba(255,255,255,.5)'; for(let k=0;k<4;k++) x.fillRect(px - cwid/2, topY - ch + ch*k/4 + 4, cwid, ch*0.06);
    x.strokeStyle = '#222'; x.lineWidth = 2*dpr; x.beginPath(); x.moveTo(px, topY - ch); x.lineTo(px, topY - ch - cw*0.025); x.stroke();
    if(cd.life > 0){
      const my = wind*(0.6 + 0.6*Math.sin(cd.ph*3));
      cd.life -= dt*Math.max(0, my - 0.3)*1.6;
      if(cd.life <= 0){ cd.life = 0; for(let k=0;k<16;k++) smoke.push({x:px, y:topY - ch - cw*0.03, vx:(Math.random()-.5)*20*dpr + wind*30*dpr, vy:-(30 + Math.random()*30)*dpr, r:3*dpr, a:.6}); if(AC) tone(300, .15, 'sine', .08); }
      const sway = Math.sin(t*7 + cd.ph)*2*dpr + my*cw*0.06*Math.sin(t*30 + cd.ph);
      const h = cw*0.09*(0.4 + 0.6*cd.life)*(1 + Math.sin(t*13 + cd.ph)*0.06), fx = px, fy = topY - ch - cw*0.03;
      const glow = x.createRadialGradient(fx, fy - h*0.4, 0, fx, fy - h*0.4, h*3); glow.addColorStop(0, 'rgba(255,190,90,.35)'); glow.addColorStop(1, 'rgba(255,150,50,0)');
      x.fillStyle = glow; x.beginPath(); x.arc(fx, fy - h*0.4, h*3, 0, Math.PI*2); x.fill();
      const g = x.createLinearGradient(fx, fy, fx, fy - h); g.addColorStop(0, '#FF8A2B'); g.addColorStop(.5, '#FFD27A'); g.addColorStop(1, 'rgba(255,250,220,.9)');
      x.fillStyle = g; x.beginPath(); x.moveTo(fx - h*0.28, fy); x.quadraticCurveTo(fx - h*0.35 + sway*0.5, fy - h*0.55, fx + sway, fy - h); x.quadraticCurveTo(fx + h*0.35 + sway*0.5, fy - h*0.55, fx + h*0.28, fy); x.fill();
    }
  });
  for(let i=smoke.length-1;i>=0;i--){ const p = smoke[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.r += 8*dpr*dt; p.a -= dt*0.35; if(p.a <= 0){ smoke.splice(i,1); continue; } x.fillStyle = 'rgba(210,210,210,' + p.a*0.35 + ')'; x.beginPath(); x.arc(p.x, p.y, p.r, 0, Math.PI*2); x.fill(); }

  if(!celebrated && candles.every(c => c.life <= 0)){
    celebrated = true; if(AC) setTimeout(song, 500);
    for(let i=0;i<220;i++) confetti.push({x:Math.random()*W, y:-Math.random()*H*0.5, vy:(80 + Math.random()*120)*dpr, vx:(Math.random()-.5)*60*dpr, r:Math.random()*Math.PI, c:['#FF5A4E','#FFD34D','#5CE1E6','#9BE37B','#C59BFF'][i%5]});
  }
  for(const p of confetti){ p.y += p.vy*dt; p.x += p.vx*dt + Math.sin(t*3 + p.r)*20*dpr*dt; p.r += dt*4; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-5*dpr, -3*dpr, 10*dpr, 6*dpr); x.restore(); }
  if(celebrated){ x.font = '700 ' + Math.round(Math.min(W,H)*0.07) + 'px "Pretendard Variable",Pretendard,sans-serif'; x.textAlign = 'center'; x.fillStyle = '#FFE9A8'; x.fillText('모두 껐습니다!', W/2, H*0.24); x.textAlign = 'start'; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
