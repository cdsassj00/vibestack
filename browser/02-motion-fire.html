    <p>카메라 앞에서 손을 흔들거나 몸을 움직이면, 움직인 자리에서만 불꽃이 피어오릅니다. 가만히 있으면 사라집니다. AI 모델 없이 "직전 화면과 달라진 픽셀"만 찾아내는 가장 단순한 컴퓨터 비전입니다.</p>

  </div>

<script>
(function(){
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); }
fit(); addEventListener('resize', fit);
const video = document.createElement('video'); video.playsInline = true; video.muted = true;
const sm = document.createElement('canvas'), sx = sm.getContext('2d', {willReadFrequently:true});
let stream = null, facing = 'user', mode = 'fire', prev = null, sound = true;
const mirror = () => facing === 'user';
const parts = [];

let AC = null, noiseGain = null;
function initAudio(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = .5;
  noiseGain = AC.createGain(); noiseGain.gain.value = 0; src.connect(f); f.connect(noiseGain); noiseGain.connect(AC.destination); src.start();
}
async function startCam(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  video.srcObject = stream; await video.play(); prev = null;
}
$('#go').onclick = async () => {
  initAudio();
  try{ await startCam(); }catch(e){ $('#status').textContent = '카메라를 켤 수 없습니다. 브라우저 카메라 권한을 허용해 주세요.'; return; }
  $('#start').style.display = 'none'; requestAnimationFrame(loop);
};
$('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try{ await startCam(); }catch(e){} };
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(o => o.setAttribute('aria-pressed', o === b)); });
$('#snd').onclick = () => { sound = !sound; $('#snd').setAttribute('aria-pressed', sound); $('#snd').textContent = sound ? '소리 켬' : '소리 끔'; };

function cover(){ const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W/vw, H/vh), dw = vw*s, dh = vh*s; return {dx:(W-dw)/2, dy:(H-dh)/2, dw, dh}; }
let last = performance.now(), level = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const m = cover();
  x.globalCompositeOperation = 'source-over';
  x.save(); if(mirror()){ x.translate(W,0); x.scale(-1,1); } x.drawImage(video, m.dx, m.dy, m.dw, m.dh); x.restore();
  x.fillStyle = 'rgba(6,9,16,.6)'; x.fillRect(0,0,W,H);

  const sw = 160, sh = Math.round(160*(video.videoHeight || 480)/(video.videoWidth || 640));
  if(sm.width !== sw || sm.height !== sh){ sm.width = sw; sm.height = sh; prev = null; }
  sx.save(); if(mirror()){ sx.translate(sw,0); sx.scale(-1,1); } sx.drawImage(video, 0, 0, sw, sh); sx.restore();
  const d = sx.getImageData(0,0,sw,sh).data, n = sw*sh, g = new Uint8ClampedArray(n);
  const moved = [];
  for(let i=0;i<n;i++){ const k = i*4; g[i] = (d[k]*3 + d[k+1]*6 + d[k+2])/10; if(prev && Math.abs(g[i] - prev[i]) > 28) moved.push(i); }
  prev = g;
  const amt = moved.length/n; level = level*0.85 + amt*0.15;
  $('#mv').style.width = Math.min(100, level*500) + '%';
  if(noiseGain) noiseGain.gain.setTargetAtTime(sound ? Math.min(0.25, level*2.5) : 0, AC.currentTime, 0.08);

  const budget = Math.min(140, moved.length);
  for(let j=0;j<budget;j++){
    const i = moved[(Math.random()*moved.length)|0], px = i % sw, py = (i/sw)|0;
    const X = m.dx + (px + Math.random())/sw*m.dw, Y = m.dy + (py + Math.random())/sh*m.dh;
    if(mode === 'fire') parts.push({x:X, y:Y, vx:(Math.random()-.5)*40*dpr, vy:-(80 + Math.random()*140)*dpr, life:0, max:0.6 + Math.random()*0.6, r:(8 + Math.random()*16)*dpr});
    else if(mode === 'water') parts.push({x:X, y:Y, vx:(Math.random()-.5)*80*dpr, vy:(Math.random()*60 - 120)*dpr, life:0, max:0.9 + Math.random()*0.5, r:(3 + Math.random()*5)*dpr});
    else parts.push({x:X, y:Y, vx:(Math.random()-.5)*160*dpr, vy:(Math.random()-.5)*160*dpr, life:0, max:0.5 + Math.random()*0.8, r:(1.5 + Math.random()*3)*dpr});
  }
  if(parts.length > 2600) parts.splice(0, parts.length - 2600);

  x.globalCompositeOperation = mode === 'water' ? 'source-over' : 'lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life += dt; const t = p.life/p.max;
    if(t >= 1){ parts.splice(i,1); continue; }
    if(mode === 'fire'){ p.vx += Math.sin(now/120 + p.y*0.02)*20*dpr*dt; p.vy -= 40*dpr*dt; }
    else if(mode === 'water'){ p.vy += 700*dpr*dt; }
    else { p.vx *= 0.97; p.vy *= 0.97; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    let col, r = p.r;
    if(mode === 'fire'){ r = p.r*(1 - t*0.6); col = t < .3 ? '255,220,120' : t < .65 ? '255,130,40' : '210,50,20'; x.fillStyle = 'rgba(' + col + ',' + (0.5*(1-t)) + ')'; }
    else if(mode === 'water'){ x.fillStyle = 'rgba(140,200,255,' + (0.85*(1-t)) + ')'; }
    else { const tw = 0.5 + 0.5*Math.sin(now/60 + i); x.fillStyle = 'rgba(255,255,' + (200 + 55*tw|0) + ',' + ((1-t)*tw) + ')'; }
    x.beginPath(); x.arc(p.x, p.y, r, 0, Math.PI*2); x.fill();
  }
  requestAnimationFrame(loop);
}
})();

<script>(function(){var b=document.getElementById('xtheme');if(b)b.addEventListener('click',function(){var l=document.documentElement.getAttribute('data-theme')==='light';if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme',l?'dark':'light');}catch(e){}});})();</script>
