<script>

const $ = s => document.querySelector(s);

    const blob = new Blob(chunks, {type: rec.mimeType}); $('#dl').href = URL.createObjectURL(blob); $('#dl').style.display = 'inline-block';
    try{ buffer = await ac().decodeAudioData(await blob.arrayBuffer()); draw(); document.querySelectorAll('#fx button').forEach(b => b.disabled = false); $('#rt').textContent = buffer.duration.toFixed(1) + '초 녹음됨 · 효과를 골라 들어 보세요'; }
    catch(e){ $('#rt').textContent = '녹음을 해석하지 못했습니다. 다시 녹음해 주세요.'; }
  };
  rec.start(); t0 = performance.now(); $('#rec').classList.add('on'); $('#rec').textContent = '멈추기';
  timer = setInterval(() => { const s = (performance.now() - t0)/1000; $('#rt').textContent = '녹음 중 ' + s.toFixed(1) + '초'; if(s > 15) rec.stop(); }, 100);
};
function draw(prog){
  const cv = $('#wv'), x = cv.getContext('2d'), W = cv.width, H = cv.height; x.fillStyle = '#0E141F'; x.fillRect(0,0,W,H);
  if(!buffer) return; const dt = buffer.getChannelData(0), step = Math.ceil(dt.length/W);
  x.fillStyle = '#FF5A4E';
  for(let i=0;i<W;i++){ let mn = 1, mx = -1; for(let j=0;j<step;j++){ const v = dt[i*step + j] || 0; if(v < mn) mn = v; if(v > mx) mx = v; } x.fillRect(i, (1 + mn)*H/2, 1, Math.max(1, (mx - mn)*H/2)); }
  if(prog !== undefined){ x.fillStyle = '#fff'; x.fillRect(prog*W, 0, 3, H); }
}
function stopPlay(){ if(src){ try{ src.stop(); }catch(e){} src = null; } playing = false; }
$('#stop').onclick = stopPlay;
function impulse(a, sec){ const len = a.sampleRate*sec, b = a.createBuffer(2, len, a.sampleRate); for(let ch=0;ch<2;ch++){ const d = b.getChannelData(ch); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1 - i/len, 2.5); } return b; }
function play(k){
  if(!buffer) return; stopPlay(); const a = ac(); let buf = buffer;
  if(k === 'rev'){ buf = a.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate); for(let ch=0;ch<buffer.numberOfChannels;ch++){ const s = buffer.getChannelData(ch), d = buf.getChannelData(ch); for(let i=0;i<s.length;i++) d[i] = s[s.length-1-i]; } }
  src = a.createBufferSource(); src.buffer = buf; let out = a.destination, node = src;
  if(k === 'chip') src.playbackRate.value = 1.6;
  if(k === 'giant') src.playbackRate.value = .65;
  if(k === 'robot'){ const g = a.createGain(); g.gain.value = 0; const o = a.createOscillator(); o.frequency.value = 55; o.connect(g.gain); o.start(); o.stop(a.currentTime + buf.duration + .2); src.connect(g); node = g; }
  if(k === 'echo'){ const dl = a.createDelay(1), fb = a.createGain(); dl.delayTime.value = .28; fb.gain.value = .45; src.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(out); }
  if(k === 'radio'){ const hp = a.createBiquadFilter(), lp = a.createBiquadFilter(), ws = a.createWaveShaper(); hp.type = 'highpass'; hp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 2600; const cv = new Float32Array(256); for(let i=0;i<256;i++){ const xx = i/128 - 1; cv[i] = Math.tanh(xx*4); } ws.curve = cv; src.connect(hp); hp.connect(lp); lp.connect(ws); node = ws; }
  if(k === 'cave'){ const cv = a.createConvolver(); cv.buffer = impulse(a, 2.8); const dry = a.createGain(); dry.gain.value = .5; src.connect(cv); cv.connect(out); src.connect(dry); node = dry; }
  if(k !== 'radio' && k !== 'robot' && k !== 'cave') node.connect(out); else node.connect(out);
  src.start(); playing = true; playStart = a.currentTime; playDur = buf.duration/src.playbackRate.value;
  src.onended = () => { playing = false; draw(); };
  document.querySelectorAll('#fx button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
}
(function anim(){ requestAnimationFrame(anim); if(playing && AC) draw(Math.min(1, (AC.currentTime - playStart)/playDur)); })();
draw();

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
