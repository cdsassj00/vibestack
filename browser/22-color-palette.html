<div class="layer" id="start"><div><span class="tag">스포이트 (EyeDropper)</span><span class="tag">사진 색 추출</span><span class="tag">PC 크롬·엣지</span><h2>화면 색 수집 팔레트</h2><p>화면 어디서든 색을 콕 집어 팔레트에 모읍니다. 다른 프로그램 창, 사진, 웹사이트 위의 색도 됩니다. 사진을 올리면 주요 색 6가지를 자동으로 뽑아 줍니다. 색을 누르면 코드가 복사되고, 글자를 올렸을 때 잘 읽히는지도 알려 줍니다.</p><button class="go" id="go">팔레트 열기</button><div class="status" id="status"></div></div></div>
<script>

const $ = s => document.querySelector(s);
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, v, f2){ const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); }
let _tt = 0;
function toast(m, ms){ const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => e.classList.remove('show'), ms || 2400); }
const DPR = () => Math.min(devicePixelRatio || 1, 2);
function canvasFit(c){ const d = DPR(); c.width = Math.round(c.clientWidth*d); c.height = Math.round(c.clientHeight*d); return d; }
async function micAnalyser(fft){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 마이크를 쓸 수 없습니다.');
  let s; try{ s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}); }catch(e){ fail('마이크 권한이 필요합니다. 주소창에서 마이크를 허용해 주세요.'); }
  const a = ac(), an = a.createAnalyser(); an.fftSize = fft || 2048; an.smoothingTimeConstant = .2; a.createMediaStreamSource(s).connect(an); return {an, stream:s};
}
async function camera(facing){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 카메라를 쓸 수 없습니다.');
  try{ return await navigator.mediaDevices.getUserMedia({video:{facingMode:facing || 'user', width:{ideal:1280}, height:{ideal:720}}, audio:false}); }catch(e){ fail('카메라 권한이 필요합니다. 주소창에서 카메라를 허용해 주세요.'); }
}
function rmsOf(b){ let s = 0; for(let i=0;i<b.length;i++) s += b[i]*b[i]; return Math.sqrt(s/b.length); }
function fail(msg){ const e = new Error(msg); e.userMsg = msg; throw e; }
function vib(p){ if(navigator.vibrate) navigator.vibrate(p); }


let pal = []; try{ pal = JSON.parse(localStorage.getItem('palette') || '[]'); }catch(e){}
function lum(h){ const v = [1,3,5].map(i => parseInt(h.substr(i,2),16)/255).map(c => c <= .03928 ? c/12.92 : Math.pow((c + .055)/1.055, 2.4)); return .2126*v[0] + .7152*v[1] + .0722*v[2]; }
function ratio(a, b){ const l1 = lum(a), l2 = lum(b); return (Math.max(l1,l2) + .05)/(Math.min(l1,l2) + .05); }
function save(){ try{ localStorage.setItem('palette', JSON.stringify(pal)); }catch(e){} render(); }
function add(h){ h = h.toLowerCase(); if(!pal.includes(h)){ pal.push(h); if(pal.length > 12) pal.shift(); } save(); }
function render(){
  const box = $('#pal'); box.innerHTML = '';
  if(!pal.length){ box.innerHTML = '<div class="empty">아래 버튼으로 색을 모아 보세요</div>'; return; }
  pal.forEach((h, i) => {
    const w = ratio(h, '#ffffff'), k = ratio(h, '#000000'), fg = w > k ? '#fff' : '#000', best = Math.max(w, k);
    const el = document.createElement('div'); el.className = 'sw'; el.style.background = h; el.style.color = fg;
    el.innerHTML = '<button class="x" aria-label="삭제">×</button><b>' + h.toUpperCase() + '</b><small>' + (fg === '#fff' ? '흰 글자' : '검은 글자') + ' 대비 ' + best.toFixed(1) + (best >= 4.5 ? ' · 읽기 좋음' : ' · 작은 글자 주의') + '</small>';
    el.onclick = e => { if(e.target.classList.contains('x')){ pal.splice(i,1); save(); return; } navigator.clipboard && navigator.clipboard.writeText(h).then(() => toast(h.toUpperCase() + ' 복사했습니다')).catch(() => toast(h.toUpperCase())); };
    box.appendChild(el);
  });
}
async function start(){ $('#note').textContent = 'EyeDropper' in window ? '"화면에서 색 따기"를 누른 뒤 화면 아무 곳이나 클릭하세요.' : '이 브라우저는 화면 스포이트를 지원하지 않습니다(PC 크롬·엣지 지원). 직접 고르기와 사진에서 뽑기는 됩니다.'; render(); }
$('#pick').onclick = async () => { if(!('EyeDropper' in window)){ toast('PC 크롬·엣지에서 지원됩니다'); return; } try{ const r = await new EyeDropper().open(); add(r.sRGBHex); }catch(e){} };
$('#manual').onchange = e => add(e.target.value);
$('#img').onchange = e => {
  const f = e.target.files[0]; if(!f) return; const im = new Image(); im.onload = () => {
    const cv = document.createElement('canvas'), s = 80; cv.width = s; cv.height = Math.round(s*im.height/im.width); const x = cv.getContext('2d'); x.drawImage(im, 0, 0, cv.width, cv.height);
    const d = x.getImageData(0,0,cv.width,cv.height).data, bins = {};
    for(let i=0;i<d.length;i+=4){ const k = (d[i]>>5) + ',' + (d[i+1]>>5) + ',' + (d[i+2]>>5); (bins[k] = bins[k] || {n:0, r:0, g:0, b:0}); bins[k].n++; bins[k].r += d[i]; bins[k].g += d[i+1]; bins[k].b += d[i+2]; }
    Object.values(bins).sort((a,b) => b.n - a.n).slice(0, 6).forEach(b => add('#' + [b.r, b.g, b.b].map(v => Math.round(v/b.n).toString(16).padStart(2,'0')).join('')));
    toast('사진에서 주요 색을 뽑았습니다');
  }; im.src = URL.createObjectURL(f);
};
$('#css').onclick = () => { const t = ':root{\n' + pal.map((h,i) => '  --color-' + (i+1) + ': ' + h + ';').join('\n') + '\n}'; navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('CSS 변수로 복사했습니다')); };
$('#clr').onclick = () => { pal = []; save(); };

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
