    <p>휴대폰을 기울이면 공이 굴러갑니다. 불이 난 자리를 피해 초록색 비상구까지 공을 보내세요. 불에 닿으면 휴대폰이 떨리고 처음 자리로 돌아갑니다. 벽에 부딪혀도 살짝 떨립니다. PC에서는 방향키를 누르거나 화면을 누른 채로 끌면 됩니다.</p>

<script>
(function(){
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); }
fit(); addEventListener('resize', fit);
const WALLS = [[0,0.2,0.75,0.04],[0.25,0.42,0.75,0.04],[0,0.64,0.75,0.04],[0.45,0.68,0.04,0.18]];
const FIRES = [[0.45,0.1,0.045],[0.62,0.3,0.04],[0.3,0.3,0.04],[0.38,0.52,0.04],[0.66,0.52,0.04],[0.86,0.8,0.045],[0.25,0.92,0.04]];
const EXIT = [0,0.86,0.16,0.14], START = [0.08,0.09], BR = 0.026;
let ball, tilt = {x:0, y:0}, src = '-', ori = null, base = null, keys = {}, drag = null, T = 0, hits = 0, playing = false, flash = 0, AC = null;
function tone(f, d, type, v){ if(!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05); }
const vib = p => navigator.vibrate && navigator.vibrate(p);
function reset(){ ball = {x:START[0], y:START[1], vx:0, vy:0}; T = 0; hits = 0; playing = true; }
reset(); playing = false;
addEventListener('deviceorientation', e => { if(e.beta == null) return; ori = e; if(!base) base = {b:e.beta, g:e.gamma}; });
$('#go').onclick = async () => {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  for(const E of [window.DeviceOrientationEvent]){ if(E && typeof E.requestPermission === 'function'){ try{ await E.requestPermission(); }catch(e){} } }
  $('#start').style.display = 'none'; base = null; reset();
};
$('#calib').onclick = () => { if(ori) base = {b:ori.beta, g:ori.gamma}; };
$('#reset').onclick = reset;
$('#again').onclick = () => { $('#end').style.display = 'none'; reset(); };
addEventListener('keydown', e => { keys[e.key] = true; if(e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => keys[e.key] = false);
c.addEventListener('pointerdown', e => { drag = e; c.setPointerCapture(e.pointerId); });
c.addEventListener('pointermove', e => { if(drag) drag = e; });
c.addEventListener('pointerup', () => drag = null);

function board(){ const top = 80*dpr, bot = 80*dpr, s = Math.min(W - 24*dpr, H - top - bot); return {s, ox:(W - s)/2, oy:top + (H - top - bot - s)/2}; }
function hitsRect(px, py, r, w){ const cx = Math.max(w[0], Math.min(px, w[0] + w[2])), cy = Math.max(w[1], Math.min(py, w[1] + w[3])); return Math.hypot(px - cx, py - cy) < r; }
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  /* 입력 */
  let tx = 0, ty = 0;
  if(ori && base){
    const a = ((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    const db = ori.beta - base.b, dg = ori.gamma - base.g;
    if(a === 90){ tx = db; ty = -dg; } else if(a === 270 || a === -90){ tx = -db; ty = dg; } else { tx = dg; ty = db; }
    tx /= 25; ty /= 25; src = '기울기 센서';
  }
  const B = board();
  if(drag){ const r = c.getBoundingClientRect(); tx = ((drag.clientX - r.left)*dpr - (B.ox + B.s/2))/(B.s/2); ty = ((drag.clientY - r.top)*dpr - (B.oy + B.s/2))/(B.s/2); src = '화면 끌기'; }
  if(keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown){ tx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0); ty = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0); src = '방향키'; }
  tx = Math.max(-1, Math.min(1, tx)); ty = Math.max(-1, Math.min(1, ty));
  tilt.x += (tx - tilt.x)*0.3; tilt.y += (ty - tilt.y)*0.3;
  $('#src').textContent = '입력: ' + (src === '-' ? '휴대폰을 기울이거나 방향키' : src);

  /* 물리 */
  if(playing){
    T += dt;
    ball.vx += tilt.x*1.5*dt; ball.vy += tilt.y*1.5*dt;
    ball.vx *= (1 - 1.1*dt); ball.vy *= (1 - 1.1*dt);
    const ox = ball.x; ball.x += ball.vx*dt;
    if(ball.x < BR || ball.x > 1 - BR || WALLS.some(w => hitsRect(ball.x, ball.y, BR, w))){ ball.x = ox; if(Math.abs(ball.vx) > .25){ vib(15); tone(220, .05, 'square', .06); } ball.vx *= -0.3; }
    const oy = ball.y; ball.y += ball.vy*dt;
    if(ball.y < BR || ball.y > 1 - BR || WALLS.some(w => hitsRect(ball.x, ball.y, BR, w))){ ball.y = oy; if(Math.abs(ball.vy) > .25){ vib(15); tone(220, .05, 'square', .06); } ball.vy *= -0.3; }
    for(const f of FIRES){ if(Math.hypot(ball.x - f[0], ball.y - f[1]) < BR + f[2]*0.8){ hits++; flash = 0.5; vib([250]); tone(150, .4, 'sawtooth', .12); ball = {x:START[0], y:START[1], vx:0, vy:0}; break; } }
    if(ball.x > EXIT[0] && ball.x < EXIT[0] + EXIT[2] && ball.y > EXIT[1]){
      playing = false; vib([80,60,80,60,200]); [660,880,1100].forEach((f,i) => setTimeout(() => tone(f, .25, 'triangle', .2), i*130));
      $('#endP').textContent = T.toFixed(1) + '초 만에 탈출했습니다. 불에 ' + hits + '번 닿았습니다. 휴대폰 속 기울기 센서 값이 공의 가속도가 되고, 충돌 순간에는 진동으로 손에 알려 줬습니다.';
      setTimeout(() => $('#end').style.display = 'grid', 500);
    }
  }
  $('#time').textContent = T.toFixed(1); $('#hits').textContent = hits;

  /* 그리기 */
  x.fillStyle = '#0B0F17'; x.fillRect(0,0,W,H);
  const S = B.s, X = v => B.ox + v*S, Y = v => B.oy + v*S;
  x.fillStyle = '#1A2130'; x.beginPath(); x.roundRect(B.ox, B.oy, S, S, 14*dpr); x.fill();
  x.strokeStyle = '#3B4558'; x.lineWidth = 3*dpr; x.stroke();
  x.fillStyle = '#12A150'; x.fillRect(X(EXIT[0]), Y(EXIT[1]), EXIT[2]*S, EXIT[3]*S);
  x.fillStyle = '#fff'; x.font = '700 ' + Math.round(S*0.032) + 'px "Pretendard Variable",Pretendard,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('비상구', X(EXIT[0] + EXIT[2]/2), Y(EXIT[1] + EXIT[3]/2)); x.textAlign = 'start';
  x.fillStyle = '#4A5670'; for(const w of WALLS){ x.beginPath(); x.roundRect(X(w[0]), Y(w[1]), w[2]*S, w[3]*S, 4*dpr); x.fill(); }
  for(const f of FIRES){
    const fx = X(f[0]), fy = Y(f[1]), r = f[2]*S;
    const g = x.createRadialGradient(fx, fy, 0, fx, fy, r*1.4); g.addColorStop(0, 'rgba(255,230,140,.95)'); g.addColorStop(.45, 'rgba(255,110,30,.85)'); g.addColorStop(1, 'rgba(220,40,10,0)');
    x.fillStyle = g; x.beginPath(); x.arc(fx, fy, r*1.4*(1 + Math.sin(now/110 + f[0]*20)*0.07), 0, Math.PI*2); x.fill();
  }
  const bx = X(ball.x), by = Y(ball.y), br = BR*S;
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(bx + br*0.25, by + br*0.3, br, 0, Math.PI*2); x.fill();
  const bg = x.createRadialGradient(bx - br*0.35, by - br*0.35, br*0.1, bx, by, br); bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(1, '#7DB3FF');
  x.fillStyle = bg; x.beginPath(); x.arc(bx, by, br, 0, Math.PI*2); x.fill();
  /* 기울기 표시 */
  const ix = W - 46*dpr, iy = H - 120*dpr; x.strokeStyle = 'rgba(255,255,255,.3)'; x.lineWidth = 2*dpr; x.beginPath(); x.arc(ix, iy, 26*dpr, 0, Math.PI*2); x.stroke();
  x.fillStyle = '#F2B705'; x.beginPath(); x.arc(ix + tilt.x*22*dpr, iy + tilt.y*22*dpr, 6*dpr, 0, Math.PI*2); x.fill();
  if(flash > 0){ flash -= dt; x.fillStyle = 'rgba(255,60,30,' + flash*0.5 + ')'; x.fillRect(0,0,W,H); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
