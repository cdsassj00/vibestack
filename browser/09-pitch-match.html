<script>

const $ = s => document.querySelector(s);
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, v, f2){ const a = ac(), t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); }

const DPR = () => Math.min(devicePixelRatio || 1, 2);
function canvasFit(c){ const d = DPR(); c.width = Math.round(c.clientWidth*d); c.height = Math.round(c.clientHeight*d); return d; }
async function micAnalyser(fft){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 마이크를 쓸 수 없습니다.');

}
function rmsOf(b){ let s = 0; for(let i=0;i<b.length;i++) s += b[i]*b[i]; return Math.sqrt(s/b.length); }
function fail(msg){ const e = new Error(msg); e.userMsg = msg; throw e; }
function vib(p){ if(navigator.vibrate) navigator.vibrate(p); }


const c = $('#c'), x = c.getContext('2d'); let d = canvasFit(c); addEventListener('resize', () => d = canvasFit(c));
const NAMES = ['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'], SCALE = [0,2,4,5,7,9,11];

function playRef(){ tone(440*Math.pow(2,(target-69)/12), 1.1, 'triangle', .25); muteUntil = performance.now() + 1400; }
$('#ref').onclick = playRef; $('#skip').onclick = pickTarget;
async function start(){ M = await micAnalyser(2048); buf = new Float32Array(M.an.fftSize); pickTarget(); }
function detect(b, sr){
  const N = 1024, cc = new Float32Array(N);
  for(let l=0;l<N;l++){ let s = 0; for(let i=0;i<N;i++) s += b[i]*b[i+l]; cc[l] = s; }
  let k = 0; while(k < N-1 && cc[k] > cc[k+1]) k++;
  let mv = -1, mp = -1; for(let i=k;i<N;i++) if(cc[i] > mv){ mv = cc[i]; mp = i; }
  if(mp <= 0 || mp >= N-1) return -1;
  const a = (cc[mp-1] + cc[mp+1] - 2*cc[mp])/2, bb = (cc[mp+1] - cc[mp-1])/2;
  return sr/(a ? mp - bb/(2*a) : mp);
}

  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now;
