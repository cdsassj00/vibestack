    try{ const out = await pipe(sm.toDataURL('image/jpeg', .85)), dd = out.depth, W = dd.width, H = dd.height, D = dd.data, ch = dd.channels || 1, T = +$('#thr').value;

function loop(){

  for(let i=0;i<8;i++) flames.push({x:bx + (Math.random()-.5)*s*.45, y:by, vx:(Math.random()-.5)*.6*d, vy:-(1.6 + Math.random()*1.8)*d*H/800, l:0, mx:40 + Math.random()*25, r:s*(.15 + Math.random()*.1)});
