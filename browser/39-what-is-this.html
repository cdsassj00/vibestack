function cover(){ const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(c.width/vw, c.height/vh), dw = vw*s, dh = vh*s; return {dx:(c.width - dw)/2, dy:(c.height - dh)/2, dw, dh}; }
function drawVideo(m, dim){ x.save(); if(mirror()){ x.translate(c.width, 0); x.scale(-1, 1); } x.drawImage(video, m.dx, m.dy, m.dw, m.dh); x.restore(); if(dim){ x.fillStyle = 'rgba(8,12,20,' + dim + ')'; x.fillRect(0, 0, c.width, c.height); } }
const P = (l, m) => ({x:m.dx + (mirror() ? 1 - l.x : l.x)*m.dw, y:m.dy + l.y*m.dh});
let lastVT = -1; function newFrame(){ if(video.currentTime !== lastVT){ lastVT = video.currentTime; return true; } return false; }
function pill(t, px, py, bg, fg, size){ size = size || 15; x.font = '600 ' + Math.round(size*d) + 'px "Pretendard Variable",Pretendard,sans-serif'; const w = x.measureText(t).width + 18*d, h = (size + 15)*d; x.fillStyle = bg || 'rgba(0,0,0,.6)'; x.beginPath(); x.roundRect(px - w/2, py - h/2, w, h, 9*d); x.fill(); x.fillStyle = fg || '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, px, py); x.textAlign = 'start'; }

let cl = null, res = null, tLast = 0; facing = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'environment' : 'user';
const KO = {'fire engine':'소방차','fire truck':'소방차','laptop':'노트북','notebook':'노트북','computer keyboard':'키보드','mouse':'마우스','cellular telephone':'휴대폰','water bottle':'물병','coffee mug':'머그잔','cup':'컵','desk':'책상','monitor':'모니터','screen':'화면','television':'텔레비전','backpack':'가방','umbrella':'우산','sunglasses':'선글라스','pen':'펜','ballpoint':'볼펜','banana':'바나나','orange':'오렌지','apple':'사과','golden retriever':'골든 리트리버','tabby':'얼룩 고양이','Egyptian cat':'고양이','book jacket':'책 표지','envelope':'봉투','wallet':'지갑','remote control':'리모컨','toilet tissue':'휴지','bucket':'양동이','lighter':'라이터','candle':'초','spotlight':'조명','lampshade':'전등갓','table lamp':'스탠드','wall clock':'벽시계','analog clock':'시계','digital clock':'전자시계','chair':'의자','folding chair':'접이식 의자','street sign':'도로 표지판','traffic light':'신호등','stretcher':'들것','ambulance':'구급차','police van':'경찰차','gas pump':'주유기','hair spray':'스프레이','pop bottle':'페트병','beer bottle':'맥주병','wine bottle':'와인병','plastic bag':'비닐봉지','paper towel':'키친타월','Band Aid':'반창고','pill bottle':'약병','syringe':'주사기','mask':'마스크','oxygen mask':'산소마스크'};
async function start(){
  await cam(); $('#status').textContent = '이미지 분류 모델 준비 중…';
  const {mod, fs} = await mpLoad('vision');
  cl = await mpCreate(mod.ImageClassifier, fs, {baseOptions:{modelAssetPath: await mpModel('image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite')}, runningMode:'VIDEO', maxResults:5});
  requestAnimationFrame(loop);
}
function loop(now){
  requestAnimationFrame(loop); const m = cover(); drawVideo(m);
  if(cl && now - tLast > 250 && newFrame()){ tLast = now; res = cl.classifyForVideo(video, now);
    const cats = res.classifications[0].categories;
    $('#top5').innerHTML = cats.map(q => { const ko = KO[q.categoryName]; return '<div><span>' + (ko ? '<b>' + ko + '</b> <span style="color:#A9B3C1;font-size:.82rem">' + q.categoryName + '</span>' : q.categoryName) + '</span><span class="b"><i style="width:' + Math.round(q.score*100) + '%"></i></span></div>'; }).join('') || '알아보는 중'; }
}

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
