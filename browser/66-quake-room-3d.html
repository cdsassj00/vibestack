function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function dropzone(el, input, cb){
  el.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if(input.files.length) cb([...input.files]); input.value = ''; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if(e.dataTransfer.files.length) cb([...e.dataTransfer.files]); });
}
function fmtBytes(n){ return n < 1024 ? n + 'B' : n < 1048576 ? (n/1024).toFixed(1) + 'KB' : (n/1048576).toFixed(1) + 'MB'; }

async function three(){ await useLib('three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', 'THREE'); await useLib('OrbitControls.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'); }
function scene3(el, bg){ const r = new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio, 2)); el.appendChild(r.domElement); const s = new THREE.Scene(); s.background = new THREE.Color(bg || 0x0b0f17); const cam = new THREE.PerspectiveCamera(45, 1, .1, 500); const ctl = new THREE.OrbitControls(cam, r.domElement); ctl.enableDamping = true;
  const fit = () => { const w = el.clientWidth, h = el.clientHeight; r.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); }; fit(); addEventListener('resize', fit); return {r, s, cam, ctl}; }

const LV = [['관심','#5AA8FF','지진 정보를 확인하고 비상용품을 점검합니다.'],['주의','#F2B533','대피 경로와 집결지를 다시 확인하고, 떨어질 물건을 치웁니다.'],['경계','#FF8A3C','흔들리면 책상 아래로 몸을 숨기고 머리를 보호합니다. 가스와 전기를 끕니다.'],['심각','#FF3B30','흔들림이 멈추면 계단으로 건물을 나와 넓은 공터(대피소)로 이동합니다.']];
let V, lvl = 0, people = [], t = 0, amb, sun;
async function start(){ await three(); V = scene3($('#v3'), 0x0a0d14); V.cam.position.set(14, 12, 16); V.ctl.target.set(0, 0, 0);
  amb = new THREE.HemisphereLight(0xaaccff, 0x222233, .7); V.s.add(amb); sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(10, 20, 8); V.s.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color:0x1b2230})); ground.rotation.x = -Math.PI/2; V.s.add(ground);
  const shelter = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({color:0x12a150, transparent:true, opacity:.6})); shelter.rotation.x = -Math.PI/2; shelter.position.set(11, .02, 11); V.s.add(shelter);
  for(let i=-3;i<=3;i++) for(let j=-3;j<=3;j++){ if(Math.random() < .2 || (i > 1 && j > 1)) continue; const h = 1 + Math.random()*6; const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, h, 1.6), new THREE.MeshStandardMaterial({color:0x3a4558, roughness:.8})); b.position.set(i*3, h/2, j*3); b.userData.base = b.position.clone(); V.s.add(b); }
  for(let k=0;k<60;k++){ const p = new THREE.Mesh(new THREE.SphereGeometry(.15, 8, 6), new THREE.MeshStandardMaterial({color:0xffd34d})); p.position.set((Math.random() - .5)*20, .15, (Math.random() - .5)*20); p.userData.sp = .02 + Math.random()*.03; V.s.add(p); people.push(p); }
  set(0); (function loop(){ requestAnimationFrame(loop); t += .016; const shake = [0, 0, .06, .12][lvl];
    V.s.children.forEach(o => { if(o.userData.base){ o.position.x = o.userData.base.x + Math.sin(t*30 + o.userData.base.z)*shake; } });
    people.forEach(p => { if(lvl === 3){ const dx = 11 - p.position.x, dz = 11 - p.position.z, d2 = Math.hypot(dx, dz); if(d2 > 2.5){ p.position.x += dx/d2*p.userData.sp*3; p.position.z += dz/d2*p.userData.sp*3; } } else { p.position.x += Math.sin(t + p.id)*.01; p.position.z += Math.cos(t*.7 + p.id)*.01; } });
    V.ctl.update(); V.r.render(V.s, V.cam); })(); }
function set(l){ lvl = l; const [n, c2, a] = LV[l]; $('#lv').textContent = '위기경보 ' + n; $('#lv').style.color = c2; $('#act').textContent = a; amb.color.set(c2); sun.intensity = [.8, .7, .5, .35][l]; document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === l)); if(l >= 2){ for(let i=0;i<3;i++) setTimeout(() => tone(l === 3 ? 950 : 700, .25, 'square', .08), i*350); vib(l === 3 ? [300,100,300] : 200); } }
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => set(+b.dataset.l));
