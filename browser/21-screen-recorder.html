<script>

const $ = s => document.querySelector(s);

  if($('#mic').checked){ try{ micS = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ micS = null; } }
  sv = vidOf(scr); const cvv = camS ? vidOf(camS) : null;
  const st = scr.getVideoTracks()[0].getSettings(); const W = Math.min(1920, st.width || 1280), H = Math.round(W*((st.height || 720)/(st.width || 1280)));
  const pv = $('#pv'); pv.width = W; pv.height = H; const x = pv.getContext('2d');
  (function drawLoop(){ raf = requestAnimationFrame(drawLoop); x.drawImage(sv, 0, 0, W, H);
    if(cvv && cvv.readyState >= 2){ const r = Math.round(H*.13), cx = W - r - 30, cy = H - r - 30; x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); x.clip(); const vw = cvv.videoWidth, vh = cvv.videoHeight, s = Math.min(vw, vh); x.translate(cx*2, 0); x.scale(-1, 1); x.drawImage(cvv, (vw - s)/2, (vh - s)/2, s, s, cx - r, cy - r, r*2, r*2); x.restore(); x.strokeStyle = '#FF5A4E'; x.lineWidth = 6; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); x.stroke(); } })();
  const out = pv.captureStream(30), a = ac(), dest = a.createMediaStreamDestination(); let hasA = false;
  [scr, micS].forEach(s => { if(s && s.getAudioTracks().length){ a.createMediaStreamSource(s).connect(dest); hasA = true; } });
  if(hasA) dest.stream.getAudioTracks().forEach(t => out.addTrack(t));
  const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const ch = []; rec = new MediaRecorder(out, mime ? {mimeType:mime} : undefined);
  rec.ondataavailable = e => e.data.size && ch.push(e.data);
  rec.onstop = () => { cancelAnimationFrame(raf); [scr, camS, micS].forEach(s => s && s.getTracks().forEach(t => t.stop())); const url = URL.createObjectURL(new Blob(ch, {type:'video/webm'})); $('#out').src = url; $('#out').style.display = 'block'; $('#dl').href = url; $('#dl').style.display = 'inline-block'; $('#rs').classList.remove('on'); $('#rs').lastChild.textContent = '녹화 완료'; $('#stop').disabled = true; $('#go2').disabled = false; };
  scr.getVideoTracks()[0].addEventListener('ended', () => rec.state === 'recording' && rec.stop());
  rec.start(1000); t0 = Date.now(); $('#rs').classList.add('on'); $('#rs').lastChild.textContent = '녹화 중'; $('#stop').disabled = false; $('#go2').disabled = true; $('#out').style.display = 'none';
};
$('#stop').onclick = () => rec && rec.state === 'recording' && rec.stop();
setInterval(() => { if(rec && rec.state === 'recording'){ const s = Math.floor((Date.now() - t0)/1000); $('#tm').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); } }, 500);

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
