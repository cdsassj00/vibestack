<canvas id="c"></canvas>
<div class="cdsa-bn" role="banner"><a href="https://cdsa.kr" target="_blank" rel="noopener"><b>한국데이터사이언티스트협회</b><span class="long">홈페이지 바로가기</span><span class="u">cdsa.kr</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div><header class="xhdr"><div class="in"><a aria-label='브라우저 능력 사전으로' class='xbrand' href='/browser/stack/'><i><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></i></a><div class="xttl"><span class="n">03</span><h1>색깔 물건으로 허공에 그리기</h1></div><a class='btn btn-ghost btn-sm xback' href='/browser/stack/'>능력 사전</a><div class="xstats"><div class="panel target"><span class="sw" id="sw" style="background:#d22"></span><span id="tgtTxt">추적할 색: 빨강<br><small style="color:var(--muted)">화면의 물건을 탭하면 바뀜</small></span></div></div><button class="btn btn-ghost btn-icon" id="xtheme" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>

<div class="layer" id="start">
  <div>
    <span class="tag">카메라</span><span class="tag">색 추적</span><span class="tag">PC·휴대폰</span>
    <h2>허공에 그림 그리기</h2>
    <p>빨간 뚜껑, 형광펜, 색종이처럼 선명한 색 물건을 들고 화면에서 그 물건을 한 번 탭하세요. 그 색을 기억해 따라다니며, 물건을 움직이는 대로 허공에 빛나는 선이 그려집니다. 펜을 올리면 선이 끊깁니다.</p>
    <button class="go" id="go">카메라 켜고 시작</button>

  </div>

<script>
(function(){
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
const ink = document.createElement('canvas'), ix = ink.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); const old = ink.width ? ix.getImageData(0,0,ink.width,ink.height) : null; ink.width = W; ink.height = H; if(old) ix.putImageData(old, 0, 0); }
fit(); addEventListener('resize', fit);
const video = document.createElement('video'); video.playsInline = true; video.muted = true;
const sm = document.createElement('canvas'), sx = sm.getContext('2d', {willReadFrequently:true});
let stream = null, facing = 'user', penDown = true, inkI = 0, widthI = 1;
const INKS = ['#FFD34D','#5CE1E6','#FF5A4E','#9BFF6A','#FFFFFF'], WIDTHS = [4,9,16];
let target = {h:0, s:.75, v:.8, rgb:[220,30,30]};
const mirror = () => facing === 'user';
function hsv(r,g,b){ r/=255; g/=255; b/=255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn; let h = 0; if(d){ if(mx === r) h = ((g-b)/d) % 6; else if(mx === g) h = (b-r)/d + 2; else h = (r-g)/d + 4; h *= 60; if(h < 0) h += 360; } return {h, s:mx ? d/mx : 0, v:mx}; }
async function startCam(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  video.srcObject = stream; await video.play();
}
$('#go').onclick = async () => { try{ await startCam(); }catch(e){ $('#status').textContent = '카메라를 켤 수 없습니다. 브라우저 카메라 권한을 허용해 주세요.'; return; } $('#start').style.display = 'none'; requestAnimationFrame(loop); };
$('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try{ await startCam(); }catch(e){} };
$('#pen').onclick = () => { penDown = !penDown; $('#pen').setAttribute('aria-pressed', penDown); $('#pen').textContent = penDown ? '펜 내림' : '펜 올림'; lastPt = null; };
$('#color').onclick = () => { inkI = (inkI + 1) % INKS.length; $('#color').style.color = INKS[inkI]; };
$('#width').onclick = () => { widthI = (widthI + 1) % WIDTHS.length; $('#width').textContent = ['가늘게','보통','굵게'][widthI]; };
$('#clear').onclick = () => ix.clearRect(0,0,W,H);
$('#save').onclick = () => { const a = document.createElement('a'); a.download = '허공그림.png'; a.href = c.toDataURL('image/png'); a.click(); };
$('#color').style.color = INKS[0]; $('#width').textContent = '보통';

function cover(){ const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W/vw, H/vh), dw = vw*s, dh = vh*s; return {dx:(W-dw)/2, dy:(H-dh)/2, dw, dh}; }
c.addEventListener('pointerdown', e => {
  if(!stream) return;
  const m = cover(), r = c.getBoundingClientRect();
  const X = (e.clientX - r.left)*dpr, Y = (e.clientY - r.top)*dpr;
  const px = Math.round((X - m.dx)/m.dw*sm.width), py = Math.round((Y - m.dy)/m.dh*sm.height);
  const d = sx.getImageData(Math.max(0,px-2), Math.max(0,py-2), 5, 5).data; let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){ R += d[i]; G += d[i+1]; B += d[i+2]; n++; }
  R/=n; G/=n; B/=n; const h = hsv(R,G,B);
  target = {h:h.h, s:h.s, v:h.v, rgb:[R,G,B]};
  $('#sw').style.background = 'rgb(' + (R|0) + ',' + (G|0) + ',' + (B|0) + ')';
  $('#tgtTxt').innerHTML = h.s < .3 ? '색이 흐립니다<br><small style="color:var(--muted)">더 선명한 색 물건을 탭하세요</small>' : '이 색을 추적합니다<br><small style="color:var(--muted)">다른 물건을 탭하면 바뀜</small>';
});

let pos = null, lastPt = null;
function loop(){
  const m = cover();
  const sw = 160, sh = Math.round(160*(video.videoHeight || 480)/(video.videoWidth || 640));
  if(sm.width !== sw || sm.height !== sh){ sm.width = sw; sm.height = sh; }
  sx.save(); if(mirror()){ sx.translate(sw,0); sx.scale(-1,1); } sx.drawImage(video, 0, 0, sw, sh); sx.restore();
  const d = sx.getImageData(0,0,sw,sh).data;
  let SX = 0, SY = 0, N = 0;
  const useHue = target.s >= 0.3;
  for(let y=0;y<sh;y++) for(let xx=0;xx<sw;xx++){
    const k = (y*sw + xx)*4, r = d[k], g = d[k+1], b = d[k+2];
    let ok;
    if(useHue){ const h = hsv(r,g,b); const dh = Math.min(Math.abs(h.h - target.h), 360 - Math.abs(h.h - target.h)); ok = dh < 16 && h.s > Math.max(.35, target.s*.6) && h.v > .2; }
    else ok = Math.abs(r - target.rgb[0]) + Math.abs(g - target.rgb[1]) + Math.abs(b - target.rgb[2]) < 60;
    if(ok){ SX += xx; SY += y; N++; }
  }
  x.save(); if(mirror()){ x.translate(W,0); x.scale(-1,1); } x.drawImage(video, m.dx, m.dy, m.dw, m.dh); x.restore();
  x.fillStyle = 'rgba(6,9,16,.35)'; x.fillRect(0,0,W,H);
  if(N > 18){
    const nx = m.dx + (SX/N + .5)/sw*m.dw, ny = m.dy + (SY/N + .5)/sh*m.dh;
    pos = pos ? {x:pos.x*0.5 + nx*0.5, y:pos.y*0.5 + ny*0.5} : {x:nx, y:ny};
    if(penDown){
      if(lastPt && Math.hypot(pos.x - lastPt.x, pos.y - lastPt.y) < W*0.25){
        ix.strokeStyle = INKS[inkI]; ix.lineWidth = WIDTHS[widthI]*dpr; ix.lineCap = 'round'; ix.lineJoin = 'round';
        ix.shadowColor = INKS[inkI]; ix.shadowBlur = 14*dpr;
        ix.beginPath(); ix.moveTo(lastPt.x, lastPt.y); ix.lineTo(pos.x, pos.y); ix.stroke();
      }
      lastPt = {x:pos.x, y:pos.y};
    }
  } else { pos = null; lastPt = null; }
  x.drawImage(ink, 0, 0);
  if(pos){ x.strokeStyle = penDown ? INKS[inkI] : '#fff'; x.lineWidth = 3*dpr; x.beginPath(); x.arc(pos.x, pos.y, 20*dpr, 0, Math.PI*2); x.stroke(); }
  else { x.font = '600 ' + Math.round(15*dpr) + 'px "Pretendard Variable",Pretendard,sans-serif'; x.fillStyle = 'rgba(255,255,255,.8)'; x.textAlign = 'center'; x.fillText('추적할 색 물건이 안 보입니다. 화면에서 물건을 탭해 색을 정하세요', W/2, H*0.16); x.textAlign = 'start'; }
  requestAnimationFrame(loop);
}
})();
</script>
