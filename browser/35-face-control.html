<script>

const $ = s => document.querySelector(s);

}

const MPV = {vision:'0.10.14', audio:'0.10.14', text:'0.10.14', genai:'0.10.25'};
async function exists(u){ try{ const r = await fetch(u, {method:'HEAD', cache:'no-store'}); return r.ok; }catch(e){ return false; } }

  const local = 'libs/mediapipe/tasks-' + kind, cdn = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-' + kind + '@' + MPV[kind];

  const fs = await mod.FilesetResolver[fn](base + '/wasm');
  return {mod, fs};

  return (await exists(l)) ? new URL(l, location.href).href : 'https://storage.googleapis.com/mediapipe-models/' + path;

}

const video = document.createElement('video'); video.playsInline = true; video.muted = true;
let stream = null, facing = 'user'; const mirror = () => facing === 'user';
async function cam(){ if(stream) stream.getTracks().forEach(t => t.stop()); stream = await camera(facing); video.srcObject = stream; await video.play(); }
if($('#flip')) $('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try{ await cam(); }catch(e){} };
function cover(){ const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(c.width/vw, c.height/vh), dw = vw*s, dh = vh*s; return {dx:(c.width - dw)/2, dy:(c.height - dh)/2, dw, dh}; }
function drawVideo(m, dim){ x.save(); if(mirror()){ x.translate(c.width, 0); x.scale(-1, 1); } x.drawImage(video, m.dx, m.dy, m.dw, m.dh); x.restore(); if(dim){ x.fillStyle = 'rgba(8,12,20,' + dim + ')'; x.fillRect(0, 0, c.width, c.height); } }
const P = (l, m) => ({x:m.dx + (mirror() ? 1 - l.x : l.x)*m.dw, y:m.dy + l.y*m.dh});
let lastVT = -1; function newFrame(){ if(video.currentTime !== lastVT){ lastVT = video.currentTime; return true; } return false; }
function pill(t, px, py, bg, fg, size){ size = size || 15; x.font = '600 ' + Math.round(size*d) + 'px "Pretendard Variable",Pretendard,sans-serif'; const w = x.measureText(t).width + 18*d, h = (size + 15)*d; x.fillStyle = bg || 'rgba(0,0,0,.6)'; x.beginPath(); x.roundRect(px - w/2, py - h/2, w, h, 9*d); x.fill(); x.fillStyle = fg || '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, px, py); x.textAlign = 'start'; }

let fl = null, res = null, mode = 'game', G = {y:0, vy:0, obs:[], t:0, score:0, over:false}, best = 0, last = performance.now();
const KO = {jawOpen:'입 벌림', eyeBlinkLeft:'왼눈 감기', eyeBlinkRight:'오른눈 감기', browInnerUp:'눈썹 안쪽 올림', browOuterUpLeft:'왼 눈썹 올림', browOuterUpRight:'오른 눈썹 올림', mouthSmileLeft:'왼쪽 미소', mouthSmileRight:'오른쪽 미소', cheekPuff:'볼 부풀리기', mouthPucker:'입 오므리기', eyeWideLeft:'왼눈 크게', eyeWideRight:'오른눈 크게', mouthFunnel:'입 동그랗게', noseSneerLeft:'코 찡그림(왼)', mouthFrownLeft:'입꼬리 내림(왼)', eyeSquintLeft:'왼눈 찡그림', tongueOut:'혀 내밀기'};
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(o => o.setAttribute('aria-pressed', o === b)); $('#bars').style.display = mode === 'meter' ? 'block' : 'none'; G = {y:0, vy:0, obs:[], t:0, score:0, over:false}; $('#score').textContent = 0; });
async function start(){
  await cam(); $('#status').textContent = '얼굴 모델 준비 중…';
  const {mod, fs} = await mpLoad('vision');
  fl = await mpCreate(mod.FaceLandmarker, fs, {baseOptions:{modelAssetPath: await mpModel('face_landmarker/face_landmarker/float16/1/face_landmarker.task')}, runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true});
  requestAnimationFrame(loop);
}
function bs(name){ const b = res && res.faceBlendshapes && res.faceBlendshapes[0]; if(!b) return 0; const c2 = b.categories.find(q => q.categoryName === name); return c2 ? c2.score : 0; }
function loop(now){
  requestAnimationFrame(loop); const dt = Math.min(.05, (now - last)/1000); last = now; const W = c.width, H = c.height, m = cover();
  if(fl && newFrame()) res = fl.detectForVideo(video, now);
  const face = res && res.faceLandmarks && res.faceLandmarks[0] ? res.faceLandmarks[0].map(l => P(l, m)) : null;
  if(mode === 'game'){
    drawVideo(m, .55); const ground = H*.82, px = W*.22, r = Math.min(W,H)*.045, jaw = bs('jawOpen');
    if(!G.over){ G.t += dt; if(jaw > .35 && G.y === 0){ G.vy = -H*1.25; tone(660, .1); } G.vy += H*2.8*dt; G.y = Math.min(0, G.y + G.vy*dt); if(G.y === 0) G.vy = 0;
      if(!G.obs.length || G.obs[G.obs.length - 1].x < W*.55 - Math.random()*W*.2) G.obs.push({x:W + r*2, pass:false});
      for(const o of G.obs){ o.x -= W*.38*dt*(1 + G.t*.02); if(!o.pass && o.x < px){ o.pass = true; G.score++; $('#score').textContent = G.score; } if(Math.abs(o.x - px) < r*1.4 && G.y > -r*1.6){ G.over = true; best = Math.max(best, G.score); $('#best').textContent = best; tone(160, .4, 'sawtooth', .12); vib(150); } }
      G.obs = G.obs.filter(o => o.x > -r*3); }
    x.fillStyle = 'rgba(255,255,255,.15)'; x.fillRect(0, ground + r, W, 3*d);
    for(const o of G.obs){ const gg = x.createRadialGradient(o.x, ground, 0, o.x, ground, r*1.6); gg.addColorStop(0, '#FFF3C0'); gg.addColorStop(.4, '#FF7A2B'); gg.addColorStop(1, 'rgba(255,60,20,0)'); x.fillStyle = gg; x.beginPath(); x.arc(o.x, ground - r*.2, r*1.6, 0, Math.PI*2); x.fill(); }
    x.fillStyle = '#5AA8FF'; x.beginPath(); x.roundRect(px - r, ground - r*2 + G.y, r*2, r*2.6, r*.5); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(px + r*.4, ground - r*1.3 + G.y, r*.22, 0, Math.PI*2); x.fill();
    pill('입 벌림 ' + Math.round(jaw*100) + '%', W/2, H*.12, jaw > .35 ? 'rgba(18,161,80,.85)' : 'rgba(0,0,0,.6)');
    if(G.over){ pill('불에 닿았습니다 · 입을 두 번 벌리면 다시', W/2, H*.45, 'rgba(227,38,27,.85)', '#fff', 18); if(jaw > .5 && !G.wait){ G.wait = true; setTimeout(() => { G = {y:0, vy:0, obs:[], t:0, score:0, over:false}; $('#score').textContent = 0; }, 400); } }
    if(!face) pill('얼굴이 보이게 해 주세요', W/2, H*.5);
  } else {
    drawVideo(m, mode === 'meter' ? .3 : 0);
    if(face && mode === 'meter'){ x.fillStyle = 'rgba(120,255,170,.8)'; for(let i=0;i<face.length;i+=2){ x.fillRect(face[i].x - d, face[i].y - d, 2*d, 2*d); }
      const b = res.faceBlendshapes[0].categories.slice().sort((a2,b2) => b2.score - a2.score).slice(0, 14);
      $('#bars').innerHTML = b.map(q => '<div><span>' + (KO[q.categoryName] || q.categoryName) + '</span><span style="background:rgba(255,255,255,.12);border-radius:4px"><i style="width:' + Math.round(q.score*100) + '%"></i></span></div>').join(''); }
    if(face && mode === 'mask'){
      const L = face[33], R = face[263], top = face[10], ang = Math.atan2(R.y - L.y, R.x - L.x), ew = Math.hypot(R.x - L.x, R.y - L.y);
      x.save(); x.translate((L.x + R.x)/2, (L.y + R.y)/2); x.rotate(ang);
      x.strokeStyle = '#1B2230'; x.lineWidth = 6*d; x.fillStyle = 'rgba(120,200,255,.35)'; [-.5, .5].forEach(k => { x.beginPath(); x.ellipse(k*ew, 0, ew*.42, ew*.3, 0, 0, Math.PI*2); x.fill(); x.stroke(); }); x.beginPath(); x.moveTo(-.08*ew, 0); x.lineTo(.08*ew, 0); x.stroke(); x.restore();
      const hy = top.y - Math.hypot(face[152].x - top.x, face[152].y - top.y)*.15, hw = ew*2.6; x.save(); x.translate(top.x, hy); x.rotate(ang);
      x.fillStyle = '#E3261B'; x.beginPath(); x.ellipse(0, 0, hw/2, hw*.38, 0, Math.PI, 0); x.fill(); x.fillRect(-hw*.62, -2*d, hw*1.24, hw*.08); x.fillStyle = '#FFD34D'; x.beginPath(); x.arc(0, -hw*.2, hw*.1, 0, Math.PI*2); x.fill(); x.restore();
    }
    if(!face) pill('얼굴이 보이게 해 주세요', W/2, H*.5);
  }
}

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
