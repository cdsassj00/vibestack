<style>

<body>
<canvas id="c"></canvas>
<div class="cdsa-bn" role="banner"><a href="https://cdsa.kr" target="_blank" rel="noopener"><b>한국데이터사이언티스트협회</b><span class="long">홈페이지 바로가기</span><span class="u">cdsa.kr</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div><header class="xhdr"><div class="in"><a aria-label='브라우저 능력 사전으로' class='xbrand' href='/browser/stack/'><i><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></i></a><div class="xttl"><span class="n">01</span><h1>손으로 불씨 옮기기</h1></div><a class='btn btn-ghost btn-sm xback' href='/browser/stack/'>능력 사전</a><div class="xstats"><div class="panel stats"><div><b id="score">0</b><span>점수</span></div><div><b id="time">60</b><span>남은 초</span></div><div><b id="lives">●●●</b><span>생명</span></div></div></div><button class="btn btn-ghost btn-icon" id="xtheme" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<div class="bottom"><span class="panel hint" id="hint">엄지와 검지를 붙여 불씨를 집으세요</span><button class="btn" id="flip">카메라 전환</button></div>

<div class="layer" id="start">
  <div>
    <span class="tag">카메라</span><span class="tag">MediaPipe 손 추적</span><span class="tag">PC·휴대폰</span>
    <h2>손으로 불씨 옮기기</h2>
    <p>화면에 떠다니는 불씨를 엄지와 검지로 집어 왼쪽 아래 물 양동이에 옮기세요. 불씨는 시간이 지나면 커지고, 너무 커지면 불이 번져 생명이 줄어듭니다. 검지 끝을 오른쪽 비상벨에 대고 있으면 보너스 점수가 있습니다.</p>
    <button class="go" id="go">카메라 켜고 시작</button>
    <div class="status" id="status"></div>
  </div>
</div>
<div class="layer" id="end" style="display:none">
  <div><h2 id="endT">끝!</h2><p id="endP"></p><button class="go" id="again">다시 하기</button></div>

<script type="module">
async function ex(u){ try{ const r = await fetch(u, {method:'HEAD'}); return r.ok; }catch(e){ return false; } }
const LOC = 'libs/mediapipe/tasks-vision', LOCAL = await ex(LOC + '/vision_bundle.mjs');
const VB = LOCAL ? new URL(LOC, location.href).href : 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const { FilesetResolver, HandLandmarker } = await import(VB + '/vision_bundle.mjs');
const HMODEL = (await ex('libs/mediapipe/models/hand_landmarker.task')) ? new URL('libs/mediapipe/models/hand_landmarker.task', location.href).href : 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); }
fit(); addEventListener('resize', fit);
const video = document.createElement('video'); video.playsInline = true; video.muted = true;
let stream = null, facing = 'user', hand = null, res = null, lastVT = -1;
const mirror = () => facing === 'user';

/* 소리 */
let AC = null;
function tone(f, d, type, v, f2){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05); }

async function startCam(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  video.srcObject = stream; await video.play();
}
$('#flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try{ await startCam(); }catch(e){} };

$('#go').onclick = async () => {
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  try{ $('#status').textContent = '카메라 켜는 중…'; await startCam(); }
  catch(e){ $('#status').textContent = '카메라를 켤 수 없습니다. 브라우저 카메라 권한을 허용해 주세요.'; return; }
  try{
    $('#status').textContent = '손 추적 AI 모델 내려받는 중… (처음 한 번)';
    const fs = await FilesetResolver.forVisionTasks(VB + '/wasm');
    const opt = d => ({baseOptions:{modelAssetPath:HMODEL, delegate:d}, runningMode:'VIDEO', numHands:2});
    try{ hand = await HandLandmarker.createFromOptions(fs, opt('GPU')); }catch(e){ hand = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
  }catch(e){ $('#status').textContent = '모델을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; return; }
  $('#start').style.display = 'none'; newGame(); requestAnimationFrame(loop);
};
$('#again').onclick = () => { $('#end').style.display = 'none'; newGame(); };

/* 게임 상태 */
let G;
function newGame(){ G = {score:0, time:60, lives:3, embers:[], held:[null,null], bellHold:0, bellUsed:false, flash:0, over:false, sparks:[], splash:[]}; }
const U = () => Math.min(W, H);
function bucket(){ const s = U(); return {x:W*0.03, y:H - s*0.36 - 70*dpr, w:s*0.34, h:s*0.3}; }
function bell(){ const s = U(); return {x:W - s*0.13, y:H*0.28, r:s*0.075}; }
function spawn(){
  const b = bucket(), s = U();
  for(let k=0;k<20;k++){
    const e = {x:W*(0.3 + Math.random()*0.55), y:H*(0.2 + Math.random()*0.45), age:0, base:s*0.035};
    if(!(e.x < b.x + b.w + s*0.1 && e.y > b.y - s*0.1)){ G.embers.push(e); return; }
  }
}
function cover(){ const vw = video.videoWidth || 640, vh = video.videoHeight || 480, s = Math.max(W/vw, H/vh), dw = vw*s, dh = vh*s; return {dx:(W-dw)/2, dy:(H-dh)/2, dw, dh}; }
const P = (l, m) => ({x:m.dx + (mirror() ? 1 - l.x : l.x)*m.dw, y:m.dy + l.y*m.dh});
const D = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const m = cover();
  x.save(); if(mirror()){ x.translate(W,0); x.scale(-1,1); } x.drawImage(video, m.dx, m.dy, m.dw, m.dh); x.restore();
  x.fillStyle = 'rgba(8,12,20,.38)'; x.fillRect(0,0,W,H);
  if(hand && video.currentTime !== lastVT){ lastVT = video.currentTime; res = hand.detectForVideo(video, now); }

  const b = bucket(), bl = bell(), s = U();
  if(!G.over){
    G.time -= dt; if(G.time <= 0){ G.time = 0; end(); }
    while(G.embers.length < 3) spawn();
  }

  /* 양동이 */
  x.fillStyle = 'rgba(47,111,219,.35)'; x.strokeStyle = '#7DB3FF'; x.lineWidth = 3*dpr;
  x.beginPath(); x.roundRect(b.x, b.y, b.w, b.h, 14*dpr); x.fill(); x.stroke();
  x.fillStyle = 'rgba(125,179,255,.35)'; const wv = Math.sin(now/300)*4*dpr;
  x.beginPath(); x.moveTo(b.x, b.y + b.h*0.35 + wv); for(let i=0;i<=20;i++){ x.lineTo(b.x + b.w*i/20, b.y + b.h*0.35 + Math.sin(now/250 + i)*4*dpr); } x.lineTo(b.x + b.w, b.y + b.h); x.lineTo(b.x, b.y + b.h); x.fill();
  label('물 양동이', b.x + b.w/2, b.y - 14*dpr);

  /* 비상벨 */
  x.fillStyle = G.flash > 0 ? '#FF2D20' : (G.bellUsed ? 'rgba(120,120,120,.6)' : 'rgba(227,38,27,.75)');
  x.beginPath(); x.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); x.fill();
  if(G.bellHold > 0){ x.strokeStyle = '#fff'; x.lineWidth = 6*dpr; x.beginPath(); x.arc(bl.x, bl.y, bl.r + 8*dpr, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1, G.bellHold/0.8)); x.stroke(); }
  label(G.bellUsed ? '사용함' : '비상벨 +2', bl.x, bl.y + bl.r + 22*dpr);

  /* 손 */
  const pinches = [];
  let tipOnBell = false;
  if(res && res.landmarks){
    res.landmarks.forEach((lms, hi) => {
      const p = lms.map(l => P(l, m));
      x.strokeStyle = 'rgba(18,161,80,.95)'; x.lineWidth = 4*dpr; x.lineCap = 'round';
      for(const cn of HandLandmarker.HAND_CONNECTIONS){ x.beginPath(); x.moveTo(p[cn.start].x, p[cn.start].y); x.lineTo(p[cn.end].x, p[cn.end].y); x.stroke(); }
      for(const q of p){ x.fillStyle = '#fff'; x.beginPath(); x.arc(q.x, q.y, 4.5*dpr, 0, Math.PI*2); x.fill(); }
      const size = D(p[0], p[9]), pin = D(p[4], p[8]) < size*0.33;
      const mid = {x:(p[4].x + p[8].x)/2, y:(p[4].y + p[8].y)/2};
      if(Math.random() < 0.6) G.sparks.push({x:p[8].x, y:p[8].y, vx:(Math.random()-.5)*60*dpr, vy:(Math.random()-.5)*60*dpr, life:0.5});
      if(pin){ x.strokeStyle = '#F2B705'; x.lineWidth = 4*dpr; x.beginPath(); x.arc(mid.x, mid.y, 18*dpr, 0, Math.PI*2); x.stroke(); }
      pinches[hi] = pin ? mid : null;
      if(D(p[8], bl) < bl.r) tipOnBell = true;
    });
  }
  if(!G.over){
    for(let hi=0; hi<2; hi++){
      const pt = pinches[hi], held = G.held[hi];
      if(pt){
        if(held){ held.x = pt.x; held.y = pt.y; }
        else {
          let best = null, bd = 1e9;
          for(const e of G.embers){ if(G.held.includes(e)) continue; const d = D(pt, e), r = e.base*(1 + e.age/12); if(d < r*2.2 && d < bd){ bd = d; best = e; } }
          if(best){ G.held[hi] = best; tone(880, .12, 'sine', .15); }
        }
      } else if(held){
        G.held[hi] = null;
        if(held.x > b.x && held.x < b.x + b.w && held.y > b.y - s*0.05 && held.y < b.y + b.h){
          G.embers.splice(G.embers.indexOf(held), 1); G.score++; tone(660, .12, 'sine', .2); setTimeout(() => tone(990, .2, 'sine', .2), 90);
          for(let i=0;i<24;i++) G.splash.push({x:held.x, y:b.y + b.h*0.35, vx:(Math.random()-.5)*300*dpr, vy:-Math.random()*320*dpr, life:0.7});
          hint('좋아요! 불씨를 껐습니다');
        }
      }
    }
    if(tipOnBell && !G.bellUsed){ G.bellHold += dt; if(G.bellHold >= 0.8){ G.bellUsed = true; G.score += 2; G.flash = 1.6; for(let i=0;i<6;i++) setTimeout(() => tone(950, .15, 'square', .1), i*260); hint('비상벨 작동! +2점'); } }
    else G.bellHold = 0;
    for(let i=G.embers.length-1;i>=0;i--){
      const e = G.embers[i]; if(G.held.includes(e)) continue;
      e.age += dt;
      if(e.age > 12){ G.embers.splice(i,1); G.lives--; tone(160, .5, 'sawtooth', .15); hint('불씨가 커져 불이 번졌습니다'); if(G.lives <= 0) end(); }
    }
  }
  if(G.flash > 0){ G.flash -= dt; if(Math.floor(now/180) % 2){ x.strokeStyle = '#FF2D20'; x.lineWidth = 18*dpr; x.strokeRect(0,0,W,H); } }

  /* 불씨 그리기 */
  for(const e of G.embers){
    const held = G.held.includes(e), r = e.base*(1 + (held ? 0 : e.age/12)*1.2), fl = 1 + Math.sin(now/90 + e.x)*0.08;
    const g = x.createRadialGradient(e.x, e.y, 0, e.x, e.y, r*2.4*fl);
    const danger = e.age > 8 && !held;
    g.addColorStop(0, '#FFF6C8'); g.addColorStop(.3, danger ? '#FF4A1C' : '#FF9A2B'); g.addColorStop(1, 'rgba(255,60,20,0)');
    x.globalCompositeOperation = 'lighter'; x.fillStyle = g; x.beginPath(); x.arc(e.x, e.y, r*2.4*fl, 0, Math.PI*2); x.fill(); x.globalCompositeOperation = 'source-over';
    if(danger && !held) label(Math.ceil(12 - e.age) + '초', e.x, e.y - r*2.6);
  }
  /* 파티클 */
  x.globalCompositeOperation = 'lighter';
  for(let i=G.sparks.length-1;i>=0;i--){ const p = G.sparks[i]; p.life -= dt; if(p.life <= 0){ G.sparks.splice(i,1); continue; } p.x += p.vx*dt; p.y += p.vy*dt; x.fillStyle = 'rgba(120,255,170,' + p.life*1.4 + ')'; x.beginPath(); x.arc(p.x, p.y, 3*dpr, 0, Math.PI*2); x.fill(); }
  x.globalCompositeOperation = 'source-over';
  for(let i=G.splash.length-1;i>=0;i--){ const p = G.splash[i]; p.life -= dt; if(p.life <= 0){ G.splash.splice(i,1); continue; } p.vy += 900*dpr*dt; p.x += p.vx*dt; p.y += p.vy*dt; x.fillStyle = 'rgba(160,205,255,' + p.life + ')'; x.beginPath(); x.arc(p.x, p.y, 4*dpr, 0, Math.PI*2); x.fill(); }

  $('#score').textContent = G.score; $('#time').textContent = Math.ceil(G.time); $('#lives').textContent = '●'.repeat(Math.max(0,G.lives)) + '○'.repeat(3 - Math.max(0,G.lives));
  if(!res || !res.landmarks || !res.landmarks.length) hint('손바닥을 카메라에 보여 주세요', true);
  requestAnimationFrame(loop);
}
function label(t, cx, cy){ x.font = '600 ' + Math.round(14*dpr) + 'px "Pretendard Variable",Pretendard, sans-serif'; const w = x.measureText(t).width + 16*dpr; x.fillStyle = 'rgba(0,0,0,.6)'; x.beginPath(); x.roundRect(cx - w/2, cy - 13*dpr, w, 26*dpr, 8*dpr); x.fill(); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, cx, cy); x.textAlign = 'start'; }
let hintT = 0;
function hint(t, soft){ const n = performance.now(); if(soft && n - hintT < 2500) return; hintT = n; $('#hint').textContent = t; }
function end(){
  if(G.over) return; G.over = true;
  $('#endT').textContent = G.lives <= 0 ? '불이 번졌습니다' : '시간 끝!';
  $('#endP').textContent = '옮긴 불씨 점수 ' + G.score + '점. 손가락 관절 21개의 위치를 AI가 실시간으로 읽어 "집기"를 판단했습니다.';
  setTimeout(() => $('#end').style.display = 'grid', 600);
}
</script>
<script>(function(){var b=document.getElementById('xtheme');if(b)b.addEventListener('click',function(){var l=document.documentElement.getAttribute('data-theme')==='light';if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');try{localStorage.setItem('theme',l?'dark':'light');}catch(e){}});})();</script>
