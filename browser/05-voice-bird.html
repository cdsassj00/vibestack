<canvas id="c"></canvas>
<div class="cdsa-bn" role="banner"><a href="https://cdsa.kr" target="_blank" rel="noopener"><b>한국데이터사이언티스트협회</b><span class="long">홈페이지 바로가기</span><span class="u">cdsa.kr</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></div><header class="xhdr"><div class="in"><a aria-label='브라우저 능력 사전으로' class='xbrand' href='/browser/stack/'><i><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg></i></a><div class="xttl"><span class="n">05</span><h1>목소리로 나는 새</h1></div><a class='btn btn-ghost btn-sm xback' href='/browser/stack/'>능력 사전</a><div class="xstats"><div class="panel stats"><div><b id="score">0</b><span>통과</span></div><div><b id="best">0</b><span>최고</span></div></div></div><button class="btn btn-ghost btn-icon" id="xtheme" aria-label="화면 밝기 전환"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>

  <div>
    <span class="tag">마이크</span><span class="tag">Web Audio 음량</span><span class="tag">PC·휴대폰</span>
    <h2>목소리로 나는 새</h2>
    <p>"아~" 하고 소리를 내는 동안 새가 위로 날아오르고, 멈추면 아래로 떨어집니다. 소리 크기로 높이를 조절해 기둥 사이를 통과하세요. 시작하면 1초 동안 주변 소음을 재서 기준을 맞춥니다. 마이크가 없으면 화면을 누르고 있거나 스페이스바로도 됩니다.</p>
    <button class="go" id="go">마이크 켜고 시작</button>
    <div class="status" id="status"></div>
  </div>

<script>
(function(){
const $ = s => document.querySelector(s);
const c = $('#c'), x = c.getContext('2d');
let W, H, dpr;
function fit(){ dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = Math.round(c.clientWidth*dpr); H = c.height = Math.round(c.clientHeight*dpr); }
fit(); addEventListener('resize', fit);
let AC = null, an = null, tb, thr = 0.03, calibrating = 0, calSum = 0, calN = 0, held = false;
let best = 0, G = null, stars = [];
for(let i=0;i<120;i++) stars.push({x:Math.random(), y:Math.random()*0.8, r:Math.random()*1.6 + .3});
function tone(f, d, type, v){ if(!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05); }
function newGame(){ G = {y:H*0.45, vy:0, cols:[], spawn:0, score:0, over:false, overT:0}; }
function calibrate(){ calibrating = 1; calSum = 0; calN = 0; }
$('#go').onclick = async () => {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:false, autoGainControl:false}});
    an = AC.createAnalyser(); an.fftSize = 1024; AC.createMediaStreamSource(s).connect(an); tb = new Float32Array(an.fftSize); calibrate();
  }catch(e){ $('#status').textContent = '마이크 없이 시작합니다. 화면을 누르고 있으면 올라갑니다.'; await new Promise(r => setTimeout(r, 1200)); }
  $('#start').style.display = 'none'; newGame();
};
$('#cal').onclick = calibrate;
c.addEventListener('pointerdown', () => { held = true; if(G && G.over && G.overT > 0.8) newGame(); });
addEventListener('pointerup', () => held = false);
addEventListener('keydown', e => { if(e.code === 'Space'){ e.preventDefault(); held = true; if(G && G.over && G.overT > 0.8) newGame(); } });
addEventListener('keyup', e => { if(e.code === 'Space') held = false; });

let last = performance.now(), level = 0;
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  let rms = 0;
  if(an){ an.getFloatTimeDomainData(tb); let s = 0; for(let i=0;i<tb.length;i++) s += tb[i]*tb[i]; rms = Math.sqrt(s/tb.length); }
  if(calibrating > 0){ calibrating -= dt; calSum += rms; calN++; if(calibrating <= 0) thr = Math.max(0.015, (calSum/calN)*3.2); }
  level = level*0.6 + rms*0.4;
  const thrust = held ? 1 : Math.max(0, Math.min(1, (level - thr)/(thr*2.5)));

  const sky = x.createLinearGradient(0,0,0,H); sky.addColorStop(0, '#0B1430'); sky.addColorStop(1, '#2A1E3E'); x.fillStyle = sky; x.fillRect(0,0,W,H);
  for(const s of stars){ x.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4*Math.sin(now/700 + s.x*40)) + ')'; x.beginPath(); x.arc(s.x*W, s.y*H, s.r*dpr, 0, Math.PI*2); x.fill(); }

  if(G){
    const bx = W*0.25, br = Math.min(W,H)*0.035, gap = H*0.34, speed = W*0.22, cw = Math.min(W,H)*0.12;
    if(!G.over){
      G.vy += (H*1.1 - thrust*H*2.6)*dt; G.vy = Math.max(-H*0.6, Math.min(H*0.7, G.vy)); G.y += G.vy*dt;
      if(calibrating <= 0){
        G.spawn -= dt;
        if(G.spawn <= 0){ G.spawn = 2.2; G.cols.push({x:W + cw, gy:H*(0.22 + Math.random()*0.5), passed:false}); }
      }
      for(const col of G.cols){
        col.x -= speed*dt;
        if(!col.passed && col.x + cw < bx){ col.passed = true; G.score++; tone(880, .1); setTimeout(() => tone(1320, .12), 80); }
        if(bx + br > col.x && bx - br < col.x + cw && (G.y - br < col.gy - gap/2 || G.y + br > col.gy + gap/2)) crash();
      }
      G.cols = G.cols.filter(cl => cl.x > -cw*2);
      if(G.y > H - br || G.y < br) crash();
    } else G.overT += dt;
    for(const col of G.cols){
      x.fillStyle = '#3B4A6B';
      x.beginPath(); x.roundRect(col.x, -20, cw, col.gy - gap/2 + 20, 14*dpr); x.fill();
      x.beginPath(); x.roundRect(col.x, col.gy + gap/2, cw, H - col.gy - gap/2 + 20, 14*dpr); x.fill();
      x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(col.x + cw*0.15, 0, cw*0.12, H);
    }
    const ang = Math.max(-0.6, Math.min(0.8, G.vy/(H*0.8)));
    x.save(); x.translate(bx, G.y); x.rotate(ang);
    const glow = x.createRadialGradient(0,0,0,0,0,br*3); glow.addColorStop(0, 'rgba(255,210,90,' + (0.25 + thrust*0.5) + ')'); glow.addColorStop(1, 'rgba(255,210,90,0)'); x.fillStyle = glow; x.beginPath(); x.arc(0,0,br*3,0,Math.PI*2); x.fill();
    x.fillStyle = '#FFD34D'; x.beginPath(); x.ellipse(0, 0, br*1.2, br, 0, 0, Math.PI*2); x.fill();
    const flap = Math.sin(now/(thrust > .1 ? 40 : 140))*br*0.7;
    x.fillStyle = '#FFB020'; x.beginPath(); x.ellipse(-br*0.2, flap*0.3, br*0.7, br*0.35 + Math.abs(flap)*0.3, -0.4, 0, Math.PI*2); x.fill();
    x.fillStyle = '#1B2230'; x.beginPath(); x.arc(br*0.5, -br*0.3, br*0.16, 0, Math.PI*2); x.fill();
    x.fillStyle = '#FF7A2B'; x.beginPath(); x.moveTo(br*1.1, -br*0.05); x.lineTo(br*1.6, br*0.12); x.lineTo(br*1.1, br*0.28); x.fill();
    x.restore();
    $('#score').textContent = G.score; $('#best').textContent = best;
    if(calibrating > 0) center('조용히… 주변 소음을 재는 중', '');
    else if(G.over) center('부딪혔습니다! ' + G.score + '개 통과', '"아~" 소리를 내거나 화면을 누르면 다시 시작');
    else if(G.score === 0 && G.cols.length < 2) center('"아~" 하고 소리 내면 올라갑니다', '');
    if(G.over && G.overT > 1.2 && thrust > 0.6 && !held) newGame();
  }
  /* 목소리 막대 */
  const mh = H*0.4, mx = W - 26*dpr, my = H*0.5 - mh/2;
  x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(mx, my, 12*dpr, mh);
  const lv = Math.min(1, level/(thr*4)); x.fillStyle = thrust > 0 ? '#FFD34D' : '#7DB3FF'; x.fillRect(mx, my + mh*(1 - lv), 12*dpr, mh*lv);
  x.fillStyle = '#fff'; x.fillRect(mx - 4*dpr, my + mh*(1 - 0.25), 20*dpr, 2*dpr);
  requestAnimationFrame(loop);
}
function crash(){ if(G.over) return; G.over = true; G.overT = 0; best = Math.max(best, G.score); tone(180, .4, 'sawtooth', .12); if(navigator.vibrate) navigator.vibrate(150); }
function center(a, b){ x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '700 ' + Math.round(Math.min(W,H)*0.05) + 'px "Pretendard Variable",Pretendard,sans-serif'; x.fillText(a, W/2, H*0.3); if(b){ x.font = '400 ' + Math.round(Math.min(W,H)*0.028) + 'px "Pretendard Variable",Pretendard,sans-serif'; x.fillStyle = '#C9D1DC'; x.fillText(b, W/2, H*0.3 + Math.min(W,H)*0.06); } x.textAlign = 'start'; }
requestAnimationFrame(loop);
})();
</script>
