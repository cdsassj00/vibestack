  fail('라이브러리를 불러오지 못했습니다. 인터넷 연결이나 libs 폴더를 확인하세요.');
}
function saveBlob(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000); }
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function dropzone(el, input, cb){
  el.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if(input.files.length) cb([...input.files]); input.value = ''; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if(e.dataTransfer.files.length) cb([...e.dataTransfer.files]); });
}
function fmtBytes(n){ return n < 1024 ? n + 'B' : n < 1048576 ? (n/1024).toFixed(1) + 'KB' : (n/1048576).toFixed(1) + 'MB'; }

async function start(){ await useLib('tesseract.min.js', 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js', 'Tesseract'); dropzone($('#dz'), $('#fi'), fs => run(URL.createObjectURL(fs[0]))); }
async function run(src){ $('#img').src = src; $('#out').textContent = ''; const t0 = performance.now();
  try{ const r = await Tesseract.recognize(src, $('#lang').value, {logger:m => { $('#pg').textContent = ({'loading tesseract core':'엔진 불러오는 중','initializing tesseract':'엔진 준비 중','loading language traineddata':'언어 데이터 받는 중','initializing api':'준비 중','recognizing text':'글자 읽는 중'}[m.status] || m.status) + (m.progress ? ' ' + Math.round(m.progress*100) + '%' : ''); }});
    $('#out').textContent = r.data.text.trim() || '읽은 글자가 없습니다'; $('#pg').textContent = '완료 · 확신도 ' + Math.round(r.data.confidence) + '% · ' + ((performance.now() - t0)/1000).toFixed(1) + '초'; }
  catch(e){ console.error(e); $('#pg').textContent = '인식에 실패했습니다. 인터넷 연결(처음 한 번)과 사진을 확인하세요.'; } }
$('#ex').onclick = () => { const c = document.createElement('canvas'); c.width = 900; c.height = 360; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 900, 360); x.fillStyle = '#111'; x.font = '700 46px "Pretendard Variable",Pretendard,sans-serif'; x.fillText('화재 대피 안내', 40, 80); x.font = '500 34px "Pretendard Variable",Pretendard,sans-serif'; x.fillText('엘리베이터 대신 계단을 이용하세요.', 40, 160); x.fillText('Emergency exit: Stairway B', 40, 230); x.fillText('집결지: 1층 주차장', 40, 300); run(c.toDataURL()); };
$('#cp').onclick = () => navigator.clipboard.writeText($('#out').textContent).then(() => toast('복사했습니다'));

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
</script>
