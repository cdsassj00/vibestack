    try{ await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); if(!g || window[g]) return kind; }catch(e){}
  }

}
function saveBlob(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000); }
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function dropzone(el, input, cb){
  el.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if(input.files.length) cb([...input.files]); input.value = ''; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if(e.dataTransfer.files.length) cb([...e.dataTransfer.files]); });
}
function fmtBytes(n){ return n < 1024 ? n + 'B' : n < 1048576 ? (n/1024).toFixed(1) + 'KB' : (n/1048576).toFixed(1) + 'MB'; }

let rows = [], cols = [], types = {}, charts = [];
const EX = '월,부서,교육과정,참여자,만족도\n1월,소방안전팀,소화기 실습,24,4.5\n1월,교육지원과,대피 훈련,40,4.2\n2월,소방안전팀,소화기 실습,31,4.6\n2월,시설관리과,전기 안전,18,4.1\n3월,교육지원과,대피 훈련,52,4.4\n3월,시설관리과,전기 안전,22,4.3\n4월,소방안전팀,응급 처치,35,4.8\n4월,교육지원과,대피 훈련,47,4.5\n5월,시설관리과,전기 안전,26,4.0\n5월,소방안전팀,응급 처치,39,4.7';
async function start(){ await Promise.all([useLib('papaparse.min.js', 'https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js', 'Papa'), useLib('chart.umd.min.js', 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js', 'Chart')]); Chart.defaults.color = '#B7C0C7'; Chart.defaults.borderColor = 'rgba(255,255,255,.08)';
  dropzone($('#dz'), $('#fi'), async fs => { const buf = await fs[0].arrayBuffer(); let t; try{ t = new TextDecoder('utf-8', {fatal:true}).decode(buf); }catch(e){ t = new TextDecoder('euc-kr').decode(buf); } load(t); }); }
function load(text){ const r = Papa.parse(text.trim(), {header:true, skipEmptyLines:true, dynamicTyping:true}); rows = r.data; cols = r.meta.fields || [];
  types = {}; cols.forEach(c2 => { const v = rows.map(o => o[c2]).filter(v2 => v2 !== null && v2 !== ''); const num = v.filter(v2 => typeof v2 === 'number').length; const date = v.filter(v2 => typeof v2 === 'string' && /^\d{4}[-./]\d{1,2}([-./]\d{1,2})?$|^\d{1,2}월$/.test(v2)).length; types[c2] = num > v.length*.8 ? '숫자' : date > v.length*.6 ? '날짜·순서' : '범주'; });
  $('#sumh').textContent = '열 요약 · ' + rows.length + '행 ' + cols.length + '열';
  $('#cols').innerHTML = '<table class="t"><tr><th>열</th><th>종류</th><th>요약</th></tr>' + cols.map(c2 => { const v = rows.map(o => o[c2]).filter(v2 => v2 !== null && v2 !== ''); let s = ''; if(types[c2] === '숫자'){ const n = v.map(Number); s = '합계 ' + n.reduce((a, b) => a + b, 0).toLocaleString() + ' · 평균 ' + (n.reduce((a, b) => a + b, 0)/n.length).toFixed(2) + ' · 최소 ' + Math.min(...n) + ' · 최대 ' + Math.max(...n); } else s = '서로 다른 값 ' + new Set(v).size + '개'; return '<tr><td>' + esc(c2) + '</td><td>' + types[c2] + '</td><td>' + esc(s) + '</td></tr>'; }).join('') + '</table>';
  ['pr', 'pc', 'pval'].forEach(id => $('#' + id).innerHTML = (id === 'pc' ? '<option value="">(없음)</option>' : '') + cols.filter(c2 => id === 'pval' ? types[c2] === '숫자' : types[c2] !== '숫자').map(c2 => '<option>' + esc(c2) + '</option>').join(''));
  autoCharts(); pivot(); }
const PAL = ['#5AA8FF','#FF7A60','#3CCB94','#F2B533','#A88BFF','#33C4D3','#F062AE'];
function agg(key, val){ const m = new Map(); rows.forEach(o => { const k = o[key]; m.set(k, (m.get(k) || 0) + (Number(o[val]) || 0)); }); return m; }
function autoCharts(){ charts.forEach(c2 => c2.destroy()); charts = []; $('#charts').innerHTML = '';
  const nums = cols.filter(c2 => types[c2] === '숫자'), cats = cols.filter(c2 => types[c2] === '범주'), dates = cols.filter(c2 => types[c2] === '날짜·순서'); const specs = [];
  if(dates[0] && nums[0]) specs.push(['line', dates[0] + '별 ' + nums[0], dates[0], nums[0]]);
  cats.slice(0, 2).forEach(c2 => nums.slice(0, 1).forEach(n => specs.push(['bar', c2 + '별 ' + n + ' 합계', c2, n])));
  if(cats[0] && nums[0]) specs.push(['doughnut', cats[0] + ' 비중', cats[0], nums[0]]);
  if(nums.length > 1) specs.push(['scatter', nums[0] + ' 와 ' + nums[1], nums[0], nums[1]]);
  if(nums[0]){ specs.push(['hist', nums[0] + ' 분포', nums[0], null]); }
  specs.slice(0, 6).forEach(([type, title, a, b]) => { const card = document.createElement('div'); card.className = 'card'; card.innerHTML = '<h3>' + esc(title) + '</h3><canvas></canvas>'; $('#charts').appendChild(card); const cv = card.querySelector('canvas'); let cfg;
    if(type === 'scatter') cfg = {type:'scatter', data:{datasets:[{data:rows.map(o => ({x:o[a], y:o[b]})), backgroundColor:PAL[0]}]}};
    else if(type === 'hist'){ const v = rows.map(o => Number(o[a])).filter(x2 => !isNaN(x2)), mn = Math.min(...v), mx = Math.max(...v), k = 6, w = (mx - mn)/k || 1, bins = Array(k).fill(0); v.forEach(x2 => bins[Math.min(k - 1, Math.floor((x2 - mn)/w))]++); cfg = {type:'bar', data:{labels:bins.map((_, i) => (mn + i*w).toFixed(1)), datasets:[{data:bins, backgroundColor:PAL[2]}]}}; }
    else { const m = agg(a, b); cfg = {type: type === 'line' ? 'line' : type, data:{labels:[...m.keys()], datasets:[{data:[...m.values()], backgroundColor: type === 'doughnut' ? PAL : PAL[1], borderColor:PAL[0], tension:.3}]}}; }
    cfg.options = {maintainAspectRatio:false, plugins:{legend:{display:type === 'doughnut'}}}; charts.push(new Chart(cv, cfg)); }); }
function pivot(){ const r = $('#pr').value, c2 = $('#pc').value, v = $('#pval').value, f = $('#pf').value; if(!r){ $('#pt').textContent = '범주 열이 없습니다'; return; }
  const rk = [...new Set(rows.map(o => o[r]))], ck = c2 ? [...new Set(rows.map(o => o[c2]))] : ['값'], cell = (a, b) => { const sel = rows.filter(o => o[r] === a && (!c2 || o[c2] === b)).map(o => Number(o[v]) || 0); if(f === 'count') return sel.length; if(!sel.length) return ''; const s = sel.reduce((x2, y2) => x2 + y2, 0); return f === 'avg' ? (s/sel.length).toFixed(2) : s.toLocaleString(); };
  $('#pt').innerHTML = '<table class="t"><tr><th>' + esc(r) + '</th>' + ck.map(k => '<th>' + esc(k) + '</th>').join('') + '</tr>' + rk.map(a => '<tr><td>' + esc(a) + '</td>' + ck.map(b => '<td>' + cell(a, b) + '</td>').join('') + '</tr>').join('') + '</table>'; }
['pr', 'pc', 'pval', 'pf'].forEach(id => $('#' + id).onchange = pivot); $('#ex').onclick = () => load(EX);

$('#go').onclick = async () => {
