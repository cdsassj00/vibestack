  requestAnimationFrame(loop); const W = c.width, H = c.height;
  const g = x.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*.7); g.addColorStop(0, '#16502F'); g.addColorStop(1, '#0A2416'); x.fillStyle = g; x.fillRect(0,0,W,H);
  const s = Math.min(W, H)*0.24;
  if(rolling > 0){
    rolling -= 0.02;
    dice.forEach(dd => { dd.v = 1 + ((Math.random()*6)|0); dd.a += .35*(rolling + .2); dd.ox = (Math.random()-.5)*30*d*rolling; dd.oy = (Math.random()-.5)*30*d*rolling; });
    if(rolling <= 0){
      rolling = 0; dice.forEach(dd => { dd.a = (Math.random()-.5)*.3; dd.ox = dd.oy = 0; });
      const sum = dice[0].v + dice[1].v; cnt++; $('#sum').textContent = sum; $('#cnt').textContent = cnt;
      hist.unshift(dice[0].v + '+' + dice[1].v); hist = hist.slice(0, 6); $('#hist').textContent = '기록: ' + hist.join(' · ');
      vib(dice[0].v === dice[1].v ? [80,60,80,60,200] : 120); tone(dice[0].v === dice[1].v ? 1046 : 660, .2, 'triangle', .2);
      if(dice[0].v === dice[1].v) toast('더블! ' + dice[0].v + ' 두 개');
    }
  }
  die(W/2 - s*0.7 + dice[0].ox, H/2 + dice[0].oy, s, dice[0].v, dice[0].a);
  die(W/2 + s*0.7 + dice[1].ox, H/2 + dice[1].oy, s, dice[1].v, dice[1].a);
}
requestAnimationFrame(loop);

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
