<script>

const $ = s => document.querySelector(s);
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); return AC; }

function canvasFit(c){ const d = DPR(); c.width = Math.round(c.clientWidth*d); c.height = Math.round(c.clientHeight*d); return d; }
async function micAnalyser(fft){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 마이크를 쓸 수 없습니다.');

  const a = ac(), an = a.createAnalyser(); an.fftSize = fft || 2048; an.smoothingTimeConstant = .2; a.createMediaStreamSource(s).connect(an); return {an, stream:s};
}
async function camera(facing){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) fail('이 브라우저에서는 카메라를 쓸 수 없습니다.');
  try{ return await navigator.mediaDevices.getUserMedia({video:{facingMode:facing || 'user', width:{ideal:1280}, height:{ideal:720}}, audio:false}); }catch(e){ fail('카메라 권한이 필요합니다. 주소창에서 카메라를 허용해 주세요.'); }
}
function rmsOf(b){ let s = 0; for(let i=0;i<b.length;i++) s += b[i]*b[i]; return Math.sqrt(s/b.length); }

let pts = [], dist = 0, recording = false, t0 = 0, lastMap = null, cur = null;
function hav(a, b){ const R = 6371000, toR = Math.PI/180, dLa = (b.lat - a.lat)*toR, dLo = (b.lon - a.lon)*toR; const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

  if(lastMap && hav(lastMap, p) < 40) return; lastMap = p;
  const dx = .004, dy = .003;
  $('#map').src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + (p.lon - dx) + ',' + (p.lat - dy) + ',' + (p.lon + dx) + ',' + (p.lat + dy) + '&layer=mapnik&marker=' + p.lat + ',' + p.lon;
  $('#open').href = 'https://www.openstreetmap.org/?mlat=' + p.lat + '&mlon=' + p.lon + '#map=17/' + p.lat + '/' + p.lon;
}
function onPos(pos){
  const p = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy, t:pos.timestamp, sp:pos.coords.speed};
  cur = p; $('#ll').textContent = p.lat.toFixed(6) + ', ' + p.lon.toFixed(6); $('#acc').textContent = Math.round(p.acc); setMap(p);
  if(recording && p.acc < 50){
    const prev = pts[pts.length - 1];
    if(!prev){ pts.push(p); }
    else { const dd = hav(prev, p); if(dd > 3){ dist += dd; const sp = p.sp != null ? p.sp*3.6 : dd/((p.t - prev.t)/1000)*3.6; $('#spd').textContent = (isFinite(sp) ? sp : 0).toFixed(1); pts.push(p); } }
    $('#dist').textContent = dist < 1000 ? Math.round(dist) + ' m' : (dist/1000).toFixed(2) + ' km'; drawPath();
  }
}
function drawPath(){
  const cv = $('#path'), x = cv.getContext('2d'), W = cv.width, H = cv.height; x.fillStyle = '#0E141F'; x.fillRect(0,0,W,H);
  if(pts.length < 1) return;
  let mnA = 1e9, mxA = -1e9, mnO = 1e9, mxO = -1e9; pts.forEach(p => { mnA = Math.min(mnA, p.lat); mxA = Math.max(mxA, p.lat); mnO = Math.min(mnO, p.lon); mxO = Math.max(mxO, p.lon); });
  const sp = Math.max(mxA - mnA, (mxO - mnO)*.8, .0002), cx = (mnO + mxO)/2, cy = (mnA + mxA)/2, sc = Math.min(W, H)*0.85/sp;
  const P = p => [W/2 + (p.lon - cx)*sc*.8, H/2 - (p.lat - cy)*sc];
  x.strokeStyle = '#FF5A4E'; x.lineWidth = 6; x.lineJoin = 'round'; x.beginPath(); pts.forEach((p,i) => { const [a,b] = P(p); i ? x.lineTo(a,b) : x.moveTo(a,b); }); x.stroke();
  const [sx,sy] = P(pts[0]), [ex,ey] = P(pts[pts.length-1]);
  x.fillStyle = '#12A150'; x.beginPath(); x.arc(sx, sy, 12, 0, Math.PI*2); x.fill(); x.fillStyle = '#FFD34D'; x.beginPath(); x.arc(ex, ey, 14, 0, Math.PI*2); x.fill();
}
async function start(){
  if(!('geolocation' in navigator)) fail('이 기기는 위치 기능을 지원하지 않습니다.');
  await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(p => { onPos(p); res(); }, e => rej(Object.assign(new Error(''), {userMsg: e.code === 1 ? '위치 권한이 필요합니다. 주소창에서 위치를 허용해 주세요.' : '위치를 가져오지 못했습니다. 실외에서 다시 시도해 주세요.'})), {enableHighAccuracy:true, timeout:15000}));
  navigator.geolocation.watchPosition(onPos, () => {}, {enableHighAccuracy:true, maximumAge:1000});
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){ try{ await DeviceOrientationEvent.requestPermission(); }catch(e){} }
  const onO = e => { let h = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? 360 - e.alpha : null); if(h == null) return; $('#arrow').style.transform = 'rotate(' + (-h) + 'deg)'; const dirs = ['북','북동','동','남동','남','남서','서','북서']; $('#hd').textContent = '향한 방향: ' + dirs[Math.round(h/45) % 8] + ' (' + Math.round(h) + '°)'; };
  addEventListener('deviceorientationabsolute', onO); addEventListener('deviceorientation', onO);
}
$('#rec').onclick = () => { recording = !recording; $('#rec').textContent = recording ? '기록 멈춤' : '기록 이어 하기'; if(recording && !t0) t0 = Date.now(); if(recording && cur) pts.length || pts.push(cur); };
$('#reset').onclick = () => { pts = []; dist = 0; t0 = recording ? Date.now() : 0; $('#dist').textContent = '0 m'; $('#spd').textContent = '0.0'; drawPath(); };
setInterval(() => { if(t0 && recording){ const s = Math.floor((Date.now() - t0)/1000); $('#time').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); } }, 500);
drawPath();

$('#go').onclick = async () => {
  ac(); $('#status').textContent = '준비 중…';
  try{ await start(); $('#start').style.display = 'none'; }
  catch(e){ console.error(e); $('#status').textContent = (e && e.userMsg) || ('시작할 수 없습니다: ' + (e && e.message || e)); }
};
